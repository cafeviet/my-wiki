<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify – Core Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 1.5rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    h1 { font-size: 1.3rem; font-weight: 700; }
    .subtitle { color: #94a3b8; font-size: 0.8rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15,23,42,0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 700px; display: block; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.7rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>Archify – Core Pipeline (Luồng cốt lõi)</h1>
    </div>
    <p class="subtitle">Probabilistic Reasoning → Structured IR → Verification → Deterministic Execution</p>
  </div>
  <div class="diagram-container">
    <svg viewBox="0 0 760 560">
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
        </marker>
        <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
        </marker>
        <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0,10 3.5,0 7" fill="#fb7185"/>
        </marker>
        <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- Lane labels -->
      <text x="30" y="30" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace">AI LAYER</text>
      <text x="380" y="30" fill="#475569" font-size="9" font-family="JetBrains Mono,monospace">ENGINE LAYER</text>

      <!-- Divider -->
      <line x1="360" y1="20" x2="360" y2="540" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>

      <!-- === LEFT: AI LAYER === -->
      <!-- User/Codebase -->
      <rect x="60" y="50" width="140" height="52" rx="6" fill="#0f172a"/>
      <rect x="60" y="50" width="140" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="72" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">User / Codebase</text>
      <text x="130" y="88" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Requirement / Prompt</text>

      <!-- Arrow down -->
      <line x1="130" y1="102" x2="130" y2="148" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- LLM Agent -->
      <rect x="55" y="148" width="150" height="60" rx="6" fill="#0f172a"/>
      <rect x="55" y="148" width="150" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="130" y="172" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">LLM Agent</text>
      <text x="130" y="188" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Semantic Reasoning</text>
      <text x="130" y="200" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">optional layer</text>

      <!-- LLM tasks list -->
      <rect x="30" y="230" width="210" height="140" rx="6" fill="rgba(136,19,55,0.1)" stroke="#fb7185" stroke-width="0.5" stroke-dasharray="4,3"/>
      <text x="45" y="248" fill="#fb7185" font-size="8" font-family="JetBrains Mono,monospace">LLM làm:</text>
      <text x="45" y="263" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Đọc yêu cầu / codebase</text>
      <text x="45" y="277" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Xác định component</text>
      <text x="45" y="291" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Xác định relationship</text>
      <text x="45" y="305" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Chọn abstraction level</text>
      <text x="45" y="319" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Tạo Typed JSON IR</text>
      <text x="45" y="333" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Nhận lỗi validator &amp; sửa</text>
      <text x="135" y="360" fill="#fb7185" font-size="9" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">AI quyết định WHAT</text>

      <!-- Arrow from LLM to IR (crossing lane) -->
      <line x1="205" y1="178" x2="420" y2="178" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-red)"/>
      <text x="310" y="170" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">candidate.json</text>

      <!-- === RIGHT: ENGINE LAYER === -->
      <!-- Typed JSON IR -->
      <rect x="415" y="148" width="150" height="60" rx="6" fill="#0f172a"/>
      <rect x="415" y="148" width="150" height="60" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="490" y="172" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Typed JSON IR</text>
      <text x="490" y="188" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Structured IR</text>
      <text x="490" y="200" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">schema_version, diagram_type</text>

      <!-- Arrow down to validator -->
      <line x1="490" y1="208" x2="490" y2="255" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Archify Validator -->
      <rect x="415" y="255" width="150" height="55" rx="6" fill="#0f172a"/>
      <rect x="415" y="255" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="490" y="277" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Validator</text>
      <text x="490" y="292" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">JSON Schema</text>
      <text x="490" y="304" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Layout / Geometry</text>

      <!-- PASS arrow down -->
      <line x1="490" y1="310" x2="490" y2="356" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>
      <text x="504" y="337" fill="#34d399" font-size="9" font-family="JetBrains Mono,monospace">PASS</text>

      <!-- FAIL arrow back to LLM -->
      <path d="M 415 282 Q 280 282 280 208 Q 280 178 205 178" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
      <text x="290" y="240" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">FAIL + diagnostics</text>
      <text x="290" y="252" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">→ LLM sửa JSON</text>

      <!-- Layout / Routing Engine -->
      <rect x="415" y="356" width="150" height="55" rx="6" fill="#0f172a"/>
      <rect x="415" y="356" width="150" height="55" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="490" y="378" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Layout Engine</text>
      <text x="490" y="393" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Grid, Coords, Edges</text>
      <text x="490" y="405" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Route, Collision</text>

      <!-- Arrow down to renderer -->
      <line x1="490" y1="411" x2="490" y2="455" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-green)"/>

      <!-- Archify Renderer -->
      <rect x="415" y="455" width="150" height="55" rx="6" fill="#0f172a"/>
      <rect x="415" y="455" width="150" height="55" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="490" y="477" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Renderer</text>
      <text x="490" y="492" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">SVG Generation</text>
      <text x="490" y="504" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">HTML Packaging</text>

      <!-- Output arrows -->
      <line x1="565" y1="482" x2="660" y2="460" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
      <line x1="565" y1="482" x2="660" y2="482" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan)"/>
      <line x1="565" y1="482" x2="660" y2="504" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-cyan)"/>

      <!-- Output boxes -->
      <rect x="660" y="450" width="70" height="22" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="695" y="464" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">HTML</text>

      <rect x="660" y="472" width="70" height="22" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="695" y="486" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">SVG</text>

      <rect x="660" y="494" width="70" height="22" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="695" y="508" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">PNG</text>

      <!-- Engine tasks -->
      <rect x="390" y="390" width="0" height="0"/>
      <text x="490" y="430" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Code quyết định HOW TO RENDER</text>

      <!-- Key principle banner -->
      <rect x="30" y="490" width="320" height="42" rx="6" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1"/>
      <text x="190" y="507" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Nguyên tắc cốt lõi:</text>
      <text x="190" y="522" fill="white" font-size="9" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">LLM không trực tiếp sinh SVG</text>

    </svg>
  </div>
  <p class="footer">Archify Core Pipeline • Architecture-as-Code Research</p>
</div>
</body>
</html>
