<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify – Agent Skill Loop</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'JetBrains Mono',monospace; background:#020617; min-height:100vh; padding:2rem; color:white; }
    .container { max-width:900px; margin:0 auto; }
    .header { margin-bottom:1.5rem; }
    .header-row { display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem; }
    .pulse-dot { width:12px; height:12px; background:#34d399; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
    h1 { font-size:1.3rem; font-weight:700; }
    .subtitle { color:#94a3b8; font-size:0.8rem; margin-left:1.75rem; }
    .diagram-container { background:rgba(15,23,42,0.5); border-radius:1rem; border:1px solid #1e293b; padding:1.5rem; overflow-x:auto; }
    svg { width:100%; min-width:750px; display:block; }
    .footer { text-align:center; margin-top:1.5rem; color:#475569; font-size:0.7rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>Agent Skill Loop – Archify Validate &amp; Deliver</h1>
    </div>
    <p class="subtitle">Skill = KNOW HOW · LLM = REASONING · CLI = EXECUTION · Validator = VERIFICATION</p>
  </div>
  <div class="diagram-container">
    <svg viewBox="0 0 820 580">
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
        <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
        <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
        <marker id="arr-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
        <marker id="arr-a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- Agent Harness boundary -->
      <rect x="20" y="15" width="350" height="545" rx="10" fill="rgba(136,19,55,0.05)" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="35" y="33" fill="#fb7185" font-size="9" font-family="JetBrains Mono,monospace">AGENT HARNESS</text>

      <!-- Execution Harness boundary -->
      <rect x="390" y="15" width="410" height="545" rx="10" fill="rgba(6,78,59,0.05)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4"/>
      <text x="405" y="33" fill="#34d399" font-size="9" font-family="JetBrains Mono,monospace">EXECUTION HARNESS (CLI)</text>

      <!-- === AGENT HARNESS === -->
      <!-- User -->
      <rect x="80" y="50" width="200" height="48" rx="6" fill="#0f172a"/>
      <rect x="80" y="50" width="200" height="48" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="180" y="70" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">User</text>
      <text x="180" y="86" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">"Use Archify to draw runtime arch"</text>

      <line x1="180" y1="98" x2="180" y2="138" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Agent Host -->
      <rect x="80" y="138" width="200" height="48" rx="6" fill="#0f172a"/>
      <rect x="80" y="138" width="200" height="48" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="180" y="158" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Agent Host</text>
      <text x="180" y="174" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">discover skill</text>

      <line x1="180" y1="186" x2="180" y2="226" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- SKILL.md -->
      <rect x="65" y="226" width="230" height="55" rx="6" fill="#0f172a"/>
      <rect x="65" y="226" width="230" height="55" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="180" y="248" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify SKILL.md</text>
      <text x="180" y="263" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">instructions · schema · examples</text>
      <text x="180" y="275" fill="#fbbf24" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">KNOW HOW</text>

      <line x1="180" y1="281" x2="180" y2="321" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- LLM -->
      <rect x="65" y="321" width="230" height="65" rx="6" fill="#0f172a"/>
      <rect x="65" y="321" width="230" height="65" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="180" y="344" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">LLM</text>
      <text x="180" y="359" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">analyze repo · select components</text>
      <text x="180" y="373" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">create Architecture IR</text>
      <text x="180" y="380" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">REASONING</text>

      <!-- LLM → candidate.json -->
      <line x1="180" y1="386" x2="180" y2="426" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-r)"/>

      <!-- candidate.json -->
      <rect x="65" y="426" width="230" height="42" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1"/>
      <text x="180" y="444" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">candidate.architecture.json</text>
      <text x="180" y="458" fill="#475569" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Typed JSON IR</text>

      <!-- candidate → validate (cross boundary) -->
      <line x1="295" y1="447" x2="440" y2="340" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-a)"/>
      <text x="370" y="385" fill="#fbbf24" font-size="8" font-family="JetBrains Mono,monospace">archify.mjs validate</text>

      <!-- === EXECUTION HARNESS === -->
      <!-- Archify Validator -->
      <rect x="430" y="300" width="200" height="65" rx="6" fill="#0f172a"/>
      <rect x="430" y="300" width="200" height="65" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="530" y="325" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Validator</text>
      <text x="530" y="340" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">JSON Schema · Layout</text>
      <text x="530" y="355" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Overlap · Route · Clearance</text>

      <!-- PASS arrow down -->
      <line x1="530" y1="365" x2="530" y2="405" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>
      <text x="545" y="388" fill="#34d399" font-size="9" font-family="JetBrains Mono,monospace">PASS</text>

      <!-- FAIL arrow back to LLM -->
      <path d="M 430 332 Q 330 332 295 386" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-r)"/>
      <text x="345" y="320" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">FAIL + diagnostics</text>
      <text x="345" y="332" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">LLM sửa JSON</text>

      <!-- Archify Renderer -->
      <rect x="430" y="405" width="200" height="65" rx="6" fill="#0f172a"/>
      <rect x="430" y="405" width="200" height="65" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="530" y="428" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Renderer</text>
      <text x="530" y="443" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">archify.mjs deliver</text>
      <text x="530" y="458" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">EXECUTION</text>

      <line x1="530" y1="470" x2="530" y2="510" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-c)"/>

      <!-- Output -->
      <rect x="430" y="510" width="200" height="42" rx="6" fill="#0f172a"/>
      <rect x="430" y="510" width="200" height="42" rx="6" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="2"/>
      <text x="530" y="528" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">architecture.html</text>
      <text x="530" y="543" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Interactive Artifact → User</text>

      <!-- CLI commands box -->
      <rect x="640" y="300" width="160" height="100" rx="6" fill="rgba(30,41,59,0.4)" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="655" y="316" fill="#475569" font-size="8" font-family="JetBrains Mono,monospace">CLI commands:</text>
      <text x="655" y="330" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">node archify.mjs validate</text>
      <text x="655" y="343" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">  architecture input.json</text>
      <text x="655" y="356" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">  --quality showcase --json</text>
      <text x="655" y="374" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">node archify.mjs deliver</text>
      <text x="655" y="387" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">  architecture input.json</text>
      <text x="655" y="400" fill="#94a3b8" font-size="7.5" font-family="JetBrains Mono,monospace">  output.html --quality showcase</text>

      <!-- Skill label -->
      <text x="650" y="80" fill="#fbbf24" font-size="9" font-weight="600" font-family="JetBrains Mono,monospace">Skill = KNOW HOW</text>
      <text x="650" y="96" fill="#fb7185" font-size="9" font-family="JetBrains Mono,monospace">LLM   = REASONING</text>
      <text x="650" y="112" fill="#34d399" font-size="9" font-family="JetBrains Mono,monospace">CLI   = EXECUTION</text>
      <text x="650" y="128" fill="#22d3ee" font-size="9" font-family="JetBrains Mono,monospace">Val.  = VERIFICATION</text>

    </svg>
  </div>
  <p class="footer">Agent Skill Loop • Archify Validate → Deliver</p>
</div>
</body>
</html>
