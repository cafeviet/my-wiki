<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify – Lộ trình triển khai 5 Phase</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'JetBrains Mono',monospace; background:#020617; min-height:100vh; padding:2rem; color:white; }
    .container { max-width:1050px; margin:0 auto; }
    .header { margin-bottom:1.5rem; }
    .header-row { display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem; }
    .pulse-dot { width:12px; height:12px; background:#fbbf24; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
    h1 { font-size:1.3rem; font-weight:700; }
    .subtitle { color:#94a3b8; font-size:0.8rem; margin-left:1.75rem; }
    .diagram-container { background:rgba(15,23,42,0.5); border-radius:1rem; border:1px solid #1e293b; padding:1.5rem; overflow-x:auto; }
    svg { width:100%; min-width:900px; display:block; }
    .footer { text-align:center; margin-top:1.5rem; color:#475569; font-size:0.7rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>Lộ trình triển khai Architecture-as-Code – 5 Phase</h1>
    </div>
    <p class="subtitle">Từ Local CLI đến Enterprise AI Architecture Governance Platform</p>
  </div>
  <div class="diagram-container">
    <svg viewBox="0 0 980 420">
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- Timeline arrow -->
      <line x1="30" y1="210" x2="960" y2="210" stroke="#1e293b" stroke-width="2" marker-end="url(#arr)"/>
      <text x="500" y="400" fill="#475569" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Mức độ trưởng thành (Maturity)</text>

      <!-- Phase colors: 1=rose, 2=amber, 3=emerald, 4=violet, 5=cyan -->

      <!-- PHASE 1 -->
      <rect x="40" y="50" width="155" height="300" rx="8" fill="rgba(136,19,55,0.08)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="117" y="72" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Phase 1</text>
      <text x="117" y="86" fill="#fb7185" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Local Agent + Skill</text>
      <rect x="57" y="98" width="121" height="38" rx="5" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
      <text x="117" y="114" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Agent</text>
      <text x="117" y="127" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Local SKILL.md</text>
      <line x1="117" y1="136" x2="117" y2="153" stroke="#fb7185" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="57" y="153" width="121" height="38" rx="5" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
      <text x="117" y="169" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Local CLI</text>
      <text x="117" y="182" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">archify.mjs</text>
      <text x="57" y="218" fill="#fb7185" font-size="8" font-family="JetBrains Mono,monospace">Mục tiêu:</text>
      <text x="57" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Hiểu cơ chế</text>
      <text x="57" y="246" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Test JSON IR</text>
      <text x="57" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Test validation</text>
      <text x="57" y="274" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• HTML artifact</text>

      <!-- Arrow between phases -->
      <line x1="195" y1="200" x2="210" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

      <!-- PHASE 2 -->
      <rect x="210" y="50" width="155" height="300" rx="8" fill="rgba(120,53,15,0.08)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="287" y="72" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Phase 2</text>
      <text x="287" y="86" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Landscape → Archify</text>
      <rect x="227" y="98" width="121" height="38" rx="5" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="287" y="114" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Landscape JSON</text>
      <text x="287" y="127" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Canonical Model</text>
      <line x1="287" y1="136" x2="287" y2="153" stroke="#fbbf24" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="227" y="153" width="121" height="38" rx="5" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="287" y="169" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Adapter</text>
      <text x="287" y="182" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">→ Archify IR → HTML</text>
      <text x="227" y="218" fill="#fbbf24" font-size="8" font-family="JetBrains Mono,monospace">Mục tiêu:</text>
      <text x="227" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Standard views</text>
      <text x="227" y="246" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Portal integration</text>
      <text x="227" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Render-on-change</text>

      <line x1="365" y1="200" x2="380" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

      <!-- PHASE 3 -->
      <rect x="380" y="50" width="155" height="300" rx="8" fill="rgba(6,78,59,0.08)" stroke="#34d399" stroke-width="1.5"/>
      <text x="457" y="72" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Phase 3</text>
      <text x="457" y="86" fill="#34d399" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Architecture-as-Code</text>
      <rect x="397" y="98" width="121" height="38" rx="5" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="457" y="114" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Model + Views</text>
      <text x="457" y="127" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Rules + CI/CD</text>
      <line x1="457" y1="136" x2="457" y2="153" stroke="#34d399" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="397" y="153" width="121" height="38" rx="5" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
      <text x="457" y="169" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Validate → Render</text>
      <text x="457" y="182" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">→ Publish Artifact</text>
      <text x="397" y="218" fill="#34d399" font-size="8" font-family="JetBrains Mono,monospace">Mục tiêu:</text>
      <text x="397" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Version + diff</text>
      <text x="397" y="246" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Governance gate</text>
      <text x="397" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Architecture delta</text>

      <line x1="535" y1="200" x2="550" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

      <!-- PHASE 4 -->
      <rect x="550" y="50" width="155" height="300" rx="8" fill="rgba(76,29,149,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="627" y="72" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Phase 4</text>
      <text x="627" y="86" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">AI Architecture Agent</text>
      <rect x="567" y="98" width="121" height="38" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
      <text x="627" y="114" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Natural Language</text>
      <text x="627" y="127" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">→ Architecture Agent</text>
      <line x1="627" y1="136" x2="627" y2="153" stroke="#a78bfa" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="567" y="153" width="121" height="38" rx="5" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
      <text x="627" y="169" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Query → View Def</text>
      <text x="627" y="182" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">→ Archify Artifact</text>
      <text x="567" y="218" fill="#a78bfa" font-size="8" font-family="JetBrains Mono,monospace">Mục tiêu:</text>
      <text x="567" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Ad-hoc views</text>
      <text x="567" y="246" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Explain / Analyze</text>
      <text x="567" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Recommend</text>

      <line x1="705" y1="200" x2="720" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

      <!-- PHASE 5 -->
      <rect x="720" y="50" width="220" height="300" rx="8" fill="rgba(8,51,68,0.08)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="830" y="72" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Phase 5</text>
      <text x="830" y="86" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Central Archify Service / MCP</text>
      <rect x="737" y="98" width="185" height="38" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="830" y="114" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Many Agents · Many Apps</text>
      <text x="830" y="127" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Unified interface</text>
      <line x1="830" y1="136" x2="830" y2="153" stroke="#22d3ee" stroke-width="1" marker-end="url(#arr)"/>
      <rect x="737" y="153" width="185" height="38" rx="5" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="830" y="169" fill="white" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Service / MCP Server</text>
      <text x="830" y="182" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">Core Validator · Renderer</text>
      <text x="737" y="218" fill="#22d3ee" font-size="8" font-family="JetBrains Mono,monospace">Mục tiêu:</text>
      <text x="737" y="232" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Centralized version</text>
      <text x="737" y="246" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Security + Audit</text>
      <text x="737" y="260" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• Standard artifact contract</text>
      <text x="737" y="274" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">• No version drift</text>

      <!-- Goal label at bottom -->
      <text x="490" y="380" fill="white" font-size="10" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">AI-assisted Architecture Governance Platform</text>

    </svg>
  </div>
  <p class="footer">Deployment Roadmap • 5 Phases • Architecture-as-Code</p>
</div>
</body>
</html>
