<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify – Target Architecture với Landscape</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'JetBrains Mono',monospace; background:#020617; min-height:100vh; padding:2rem; color:white; }
    .container { max-width:1000px; margin:0 auto; }
    .header { margin-bottom:1.5rem; }
    .header-row { display:flex; align-items:center; gap:1rem; margin-bottom:0.5rem; }
    .pulse-dot { width:12px; height:12px; background:#a78bfa; border-radius:50%; animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
    h1 { font-size:1.3rem; font-weight:700; }
    .subtitle { color:#94a3b8; font-size:0.8rem; margin-left:1.75rem; }
    .diagram-container { background:rgba(15,23,42,0.5); border-radius:1rem; border:1px solid #1e293b; padding:1.5rem; overflow-x:auto; }
    svg { width:100%; min-width:800px; display:block; }
    .footer { text-align:center; margin-top:1.5rem; color:#475569; font-size:0.7rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>Kiến trúc mục tiêu với Landscape &amp; Architecture Portal</h1>
    </div>
    <p class="subtitle">Landscape DB → Canonical Model → View Generator → Archify → Portal</p>
  </div>
  <div class="diagram-container">
    <svg viewBox="0 0 900 620">
      <defs>
        <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
        <marker id="arr-v" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
        <marker id="arr-c" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
        <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
        <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- === TOP: Users === -->
      <!-- User / Architect -->
      <rect x="360" y="20" width="160" height="50" rx="6" fill="#0f172a"/>
      <rect x="360" y="20" width="160" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="440" y="42" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">User / Architect</text>
      <text x="440" y="58" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Portal · Agent · Natural Language</text>

      <!-- Arrow left → Portal -->
      <line x1="360" y1="45" x2="220" y2="45" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
      <!-- Arrow right → Agent -->
      <line x1="520" y1="45" x2="660" y2="45" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-r)"/>

      <!-- Landscape Portal (left branch) -->
      <rect x="100" y="20" width="140" height="50" rx="6" fill="#0f172a"/>
      <rect x="100" y="20" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="170" y="42" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Architecture</text>
      <text x="170" y="56" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Portal</text>

      <!-- Architecture Agent (right branch) -->
      <rect x="640" y="20" width="160" height="50" rx="6" fill="#0f172a"/>
      <rect x="640" y="20" width="160" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="720" y="40" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Architecture Agent</text>
      <text x="720" y="56" fill="#fb7185" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">LLM / Natural Language</text>

      <!-- Both → View Definition -->
      <line x1="170" y1="70" x2="170" y2="110" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="170" y1="110" x2="340" y2="130" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-c)"/>
      <line x1="720" y1="70" x2="720" y2="110" stroke="#fb7185" stroke-width="1.5"/>
      <line x1="720" y1="110" x2="560" y2="130" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-r)"/>

      <!-- View Definition -->
      <rect x="330" y="120" width="230" height="50" rx="6" fill="#0f172a"/>
      <rect x="330" y="120" width="230" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="445" y="142" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">View Definition</text>
      <text x="445" y="158" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Enterprise · Domain · Runtime · Integration</text>

      <!-- View Def → Architecture Query API -->
      <line x1="445" y1="170" x2="445" y2="215" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Architecture Query API -->
      <rect x="330" y="215" width="230" height="50" rx="6" fill="#0f172a"/>
      <rect x="330" y="215" width="230" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="445" y="237" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Architecture Query API</text>
      <text x="445" y="253" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Query · Filter · Select</text>

      <!-- Landscape Repository (feeds into API) -->
      <rect x="640" y="215" width="170" height="50" rx="6" fill="#0f172a"/>
      <rect x="640" y="215" width="170" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="725" y="237" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Landscape</text>
      <text x="725" y="253" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Repository / Canonical Model</text>
      <line x1="640" y1="240" x2="562" y2="240" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-v)"/>
      <text x="601" y="233" fill="#a78bfa" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">feeds</text>

      <!-- API → View Generator -->
      <line x1="445" y1="265" x2="445" y2="310" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>

      <!-- View Generator -->
      <rect x="330" y="310" width="230" height="50" rx="6" fill="#0f172a"/>
      <rect x="330" y="310" width="230" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="445" y="332" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">View Generator</text>
      <text x="445" y="348" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Transform · Adapter · Map</text>

      <!-- View Generator → Archify JSON IR -->
      <line x1="445" y1="360" x2="445" y2="405" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>

      <!-- Archify JSON IR -->
      <rect x="330" y="405" width="230" height="50" rx="6" fill="#0f172a"/>
      <rect x="330" y="405" width="230" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="445" y="427" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify JSON IR</text>
      <text x="445" y="443" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Presentation IR – không sửa tay</text>

      <!-- IR → Validation/Governance -->
      <line x1="445" y1="455" x2="445" y2="498" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- CI/CD branch from IR -->
      <line x1="560" y1="430" x2="680" y2="430" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
      <rect x="680" y="415" width="110" height="30" rx="5" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
      <text x="735" y="432" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">CI/CD Pipeline</text>

      <!-- Validation / Governance -->
      <rect x="330" y="498" width="230" height="50" rx="6" fill="#0f172a"/>
      <rect x="330" y="498" width="230" height="50" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
      <text x="445" y="520" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Validation / Governance</text>
      <text x="445" y="536" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">Schema · Layout · Policy</text>

      <!-- Validation → Renderer -->
      <line x1="330" y1="523" x2="230" y2="523" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-r)"/>
      <text x="278" y="515" fill="#fb7185" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace">PASS</text>

      <!-- Archify Renderer -->
      <rect x="80" y="498" width="150" height="50" rx="6" fill="#0f172a"/>
      <rect x="80" y="498" width="150" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="155" y="520" fill="white" font-size="11" font-weight="600" text-anchor="middle" font-family="JetBrains Mono,monospace">Archify Renderer</text>
      <text x="155" y="535" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="JetBrains Mono,monospace">SVG · HTML · PNG</text>

      <!-- Renderer → Portal (back) -->
      <line x1="155" y1="498" x2="155" y2="90" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr-c)"/>
      <line x1="155" y1="90" x2="170" y2="70" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="90" y="300" fill="#22d3ee" font-size="8" text-anchor="middle" font-family="JetBrains Mono,monospace" transform="rotate(-90,90,300)">Architecture Artifact → Portal</text>

      <!-- Legend -->
      <text x="660" y="310" fill="white" font-size="10" font-weight="600" font-family="JetBrains Mono,monospace">Legend</text>
      <rect x="660" y="320" width="14" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
      <text x="680" y="329" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">Source of Truth</text>
      <rect x="660" y="336" width="14" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="680" y="345" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">Generator / Engine</text>
      <rect x="660" y="352" width="14" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="680" y="361" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">Presentation IR</text>
      <rect x="660" y="368" width="14" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
      <text x="680" y="377" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">Validation / Governance</text>
      <rect x="660" y="384" width="14" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="680" y="393" fill="#94a3b8" font-size="8" font-family="JetBrains Mono,monospace">Portal / Artifact</text>

    </svg>
  </div>
  <p class="footer">Target Architecture • Archify + Landscape + Portal</p>
</div>
</body>
</html>
