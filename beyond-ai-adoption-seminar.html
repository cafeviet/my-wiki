:root{--navy:#0b1f36;--ink:#102a43;--muted:#52677d;--soft:#7890a8;--blue:#1769aa;--blue2:#3f88c5;--ice:#eef4fb;--paper:#f7f9fc;--white:#fff;--line:#c5d3e2;--green:#16866a;--amber:#b97808;--red:#c23b4a;--scale:1;--dd-paper:#f7f9fc;--dd-ink:#102a43;--dd-muted:#52677d;--dd-soft:#7890a8;--dd-accent:#1769aa;--dd-accent-tint:rgba(23,105,170,.09)}
.slide.dark{--dd-paper:#0b1f36;--dd-ink:#f7f9fc;--dd-muted:#b8c7d9;--dd-soft:#91a7bd;--dd-accent:#66aee8;--dd-accent-tint:rgba(102,174,232,.14)}
.dd-svg{width:100%;height:100%;display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111f;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif}button{font:inherit}.stage{position:fixed;inset:0;overflow:hidden}.deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--paper)}
.slide{position:absolute;inset:0;display:none;padding:62px 84px 94px;background:var(--paper);overflow:hidden}.slide.active{display:block}.slide.dark{background:var(--navy);color:var(--paper)}.slide.ice{background:var(--ice)}
.chapter{margin:0 0 14px;color:var(--blue);font:700 17px/1 Consolas,monospace;letter-spacing:.15em;text-transform:uppercase}.dark .chapter{color:#79b9eb}.headline{margin:0;max-width:1660px;font:400 54px/1.05 Merriweather,Georgia,"Times New Roman",serif;letter-spacing:-.025em}.key{margin:17px 0 0;max-width:1540px;color:var(--muted);font-size:28px;line-height:1.32}.dark .key{color:#b8c7d9}.canvas{position:absolute;left:84px;right:84px;top:244px;bottom:100px}.footer{position:absolute;left:84px;right:84px;bottom:30px;height:36px;border-top:1px solid var(--line);padding-top:13px;display:flex;gap:18px;align-items:center;color:var(--muted);font-size:14px}.dark .footer{border-color:#294967;color:#a7bad0}.footer .num{min-width:30px;color:var(--blue);font-weight:800}.dark .footer .num{color:#79b9eb}.footer .src{margin-left:auto;display:flex;gap:12px}.footer a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}.tag{display:inline-flex;padding:6px 11px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font:700 14px/1 Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.tag.fact{color:#0b6d58;border-color:#75baa9;background:#effaf6}.tag.self{color:#744b00;border-color:#d8b465;background:#fff8e7}.tag.interpret{color:#24577f;border-color:#8eb6d5;background:#f1f7fc}.tag.hypothesis{color:#8c2937;border-color:#d99aa3;background:#fff1f3}.tag.proposed{color:#4f4a12;border-color:#c9c26d;background:#fffde6}.tag.illustrative{color:#6b487d;border-color:#bfa5cc;background:#fbf5ff}
.accent{color:var(--blue)}.dark .accent{color:#79b9eb}.tiny{color:var(--muted);font-size:17px;line-height:1.35}.dark .tiny{color:#a7bad0}.big{font:400 54px/1.18 Merriweather,Georgia,serif;letter-spacing:-.02em}.grid{display:grid;gap:22px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:26px}.dark .card{border-color:#294967;background:#102b47}.card h3{margin:0 0 10px;font-size:26px}.card p,.card li{margin:4px 0;font-size:21px;line-height:1.42}.card ul{margin:8px 0;padding-left:24px}.label{margin-bottom:10px;color:var(--blue);font:700 14px/1 Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}.dark .label{color:#79b9eb}
.flow-svg{width:100%;height:100%;display:block}.svg-node{fill:#fff;stroke:var(--ink);stroke-width:2}.svg-node.focal{fill:#eaf4fc;stroke:var(--blue);stroke-width:3}.svg-line{fill:none;stroke:var(--muted);stroke-width:3}.svg-label{fill:var(--ink);font:700 24px Arial,sans-serif;text-anchor:middle}.svg-sub{fill:var(--muted);font:16px Consolas,monospace;text-anchor:middle}.diagram{height:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:20px}.dark .diagram{background:#102b47;border-color:#294967}
.chain{height:100%;display:flex;align-items:center;justify-content:center;gap:14px}.node{min-width:178px;padding:20px;border:2px solid var(--ink);border-radius:8px;background:#fff;text-align:center;font-size:22px;font-weight:700}.node.focal{border-color:var(--blue);background:#eaf4fc;color:var(--blue)}.node.darknode{background:var(--navy);color:#fff}.arrow{color:var(--blue);font-size:33px;font-weight:800}.stack{display:flex;flex-direction:column;gap:12px}.bar{border:1px solid var(--line);border-radius:7px;background:#fff;padding:16px 20px;font-size:21px;font-weight:650}.dark .bar{background:#132e4a;border-color:#355574}
.stair{height:100%;display:flex;align-items:flex-end;justify-content:center;gap:14px}.stair .s{width:240px;padding:22px 14px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:#fff;color:var(--ink);text-align:center;font-size:21px;font-weight:750}.stair .s:nth-child(1){height:120px}.stair .s:nth-child(2){height:190px}.stair .s:nth-child(3){height:260px}.stair .s:nth-child(4){height:330px}.stair .s:nth-child(5){height:400px}.stair .s:nth-child(6){height:470px}.stair .s.current{border:3px solid var(--blue);background:#eaf4fc}.stair .s:last-child{background:var(--navy);color:#fff}.dark .stair .s:last-child{border-color:#79b9eb}
.value-stream{display:grid;grid-template-columns:1fr 1fr;gap:34px;height:100%}.stream{border:1px solid var(--line);border-radius:10px;background:#fff;padding:30px}.stream h3{margin:0 0 24px;font-size:28px}.seg{height:68px;margin:10px 0;padding:17px 20px;background:#dfe9f4;border-left:6px solid var(--muted);font-size:21px;font-weight:700;display:flex;justify-content:space-between}.seg.hot{background:#fff1e0;border-color:var(--amber)}.seg.fast{background:#e7f6f2;border-color:var(--green)}
.bottle{display:flex;height:100%;align-items:center;justify-content:center;gap:8px}.pipe{height:150px;min-width:210px;border:3px solid var(--muted);display:grid;place-items:center;background:#fff;font-size:22px;font-weight:700}.pipe.fast{min-width:120px;background:#e7f6f2}.pipe.blocked{height:260px;min-width:270px;background:#fff1e0;border-color:var(--amber)}

<script>
const sources={
1:['Timee — Agent Harness Group','https://productpr.timee.co.jp/n/n99011b2a6947?hl=en'],
2:['OpenAI — Harness engineering','https://openai.com/index/harness-engineering/'],
3:['Anthropic — Harness design','https://www.anthropic.com/engineering/harness-design-long-running-apps'],
4:['Google Cloud — Agent harness','https://cloud.google.com/discover/agent-harness'],
5:['Talkdesk — Agent Harness Delivery','https://www.talkdesk.com/blog/from-writing-code-directing-work-agent-harness-delivery/'],
6:['DeepSeek Harness','https://www.deepseek.com/harness/en/'],
7:['DORA — 2025 Report','https://dora.dev/research/2025/dora-report/']};
function flowSvg(id,nodes,focal=-1,subs=[]){const n=nodes.length,w=240,g=48,total=n*w+(n-1)*g,vw=Math.max(680,total+80),start=(vw-total)/2,y=92,h=128;let arrows='';for(let i=0;i<n-1;i++){const x1=start+i*(w+g)+w,x2=start+(i+1)*(w+g);arrows+=`<line class="svg-line" x1="${x1}" y1="156" x2="${x2-12}" y2="156" marker-end="url(#${id}-arrow)"/>`}let boxes='';nodes.forEach((t,i)=>{const x=start+i*(w+g);boxes+=`<rect class="svg-node ${i===focal?'focal':''}" x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="svg-label" x="${x+w/2}" y="${y+55}">${t}</text>${subs[i]?`<text class="svg-sub" x="${x+w/2}" y="${y+86}">${subs[i]}</text>`:''}`});return `<svg class="flow-svg" viewBox="0 0 ${vw} 320" role="img" aria-labelledby="${id}-title ${id}-desc"><title id="${id}-title">${nodes.join(' tới ')}</title><desc id="${id}-desc">Quy trình theo thứ tự ${nodes.join(', ')}.</desc><defs><marker id="${id}-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#52677d"/></marker></defs>${arrows}${boxes}</svg>`}
/* diagram-design: Loop (flywheel) — profile my-wiki tokens. Ring arcs clockwise + dashed write-back spokes to a dark hub. */
function loopSvg(id,opts){
  const {stations,focal=-1}=opts;
  const cx=520,cy=344,R=232,sw=180,sh=72,A=112,B=58;
  const N=stations.length,rad=a=>a*Math.PI/180;
  const cxk=k=>cx+R*Math.cos(rad(-90+k*360/N)), cyk=k=>cy+R*Math.sin(rad(-90+k*360/N));
  const boxDist=(ux,uy,hw,hh)=>Math.min(Math.abs(ux)<1e-6?1e9:hw/Math.abs(ux),Math.abs(uy)<1e-6?1e9:hh/Math.abs(uy));
  // ring arcs on the station circle
  const inter=(k)=>{ // return {entry:ang, exit:ang} intersection angles of circle with station box edges
    const bx=cxk(k)-sw/2,by=cyk(k)-sh/2,ex=cxk(k)+sw/2,ey=cyk(k)+sh/2,pts=[];
    for(const xe of [bx,ex]){const disc=R*R-(xe-cx)*(xe-cx);if(disc>=0){const s=Math.sqrt(disc);for(const yy of [cy+s,cy-s])if(yy>=by-0.5&&yy<=ey+0.5)pts.push([xe,yy])}}
    for(const ye of [by,ey]){const disc=R*R-(ye-cy)*(ye-cy);if(disc>=0){const s=Math.sqrt(disc);for(const xx of [cx+s,cx-s])if(xx>=bx-0.5&&xx<=ex+0.5)pts.push([xx,ye])}}
    return pts.map(([x,y])=>Math.atan2(y-cy,x-cx));
  };
  const norm=a=>{while(a<-Math.PI)a+=2*Math.PI;while(a>Math.PI)a-=2*Math.PI;return a};
  let ring='';
  for(let k=0;k<N;k++){const j=(k+1)%N;
    const thk=rad(-90+k*360/N),thj=rad(-90+j*360/N);
    const ak=inter(k).sort((p,q)=>norm(p-thk)-norm(q-thk));
    // exit = smallest positive clockwise offset from thk
    const exitAng=ak.map(a=>({a,d:((a-thk)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)})).sort((p,q)=>p.d-q.d)[0].a;
    const aj=inter(j);
    // entry into j = intersection immediately before thj clockwise (largest offset < 2PI going ccw)
    const entryAng=aj.map(a=>({a,d:((thj-a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)})).sort((p,q)=>p.d-q.d)[0].a;
    const overhang=1.2/R, endAng=entryAng-overhang;
    const x1=cx+R*Math.cos(exitAng),y1=cy+R*Math.sin(exitAng),x2=cx+R*Math.cos(endAng),y2=cy+R*Math.sin(endAng);
    ring+=`<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="var(--dd-muted)" stroke-width="1.6" marker-end="url(#${id}-ra)"/>`;
  }
  // dashed spokes
  let spokes='';
  for(let k=0;k<N;k++){const th=rad(-90+k*360/N),ux=Math.cos(th),uy=Math.sin(th);
    const ds=boxDist(ux,uy,sw/2,sh/2),dh=boxDist(ux,uy,A,B),gap=8;
    const sx=cxk(k)-ds*ux,sy=cyk(k)-ds*uy,hx=cx+(dh+gap)*ux,hy=cy+(dh+gap)*uy;
    spokes+=`<path d="M ${sx.toFixed(2)} ${sy.toFixed(2)} L ${hx.toFixed(2)} ${hy.toFixed(2)}" fill="none" stroke="var(--dd-soft)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#${id}-sp)"/>`;
  }
  // station boxes
  let boxes='';
  stations.forEach((st,k)=>{const x=cxk(k)-sw/2,y=cyk(k)-sh/2,f=k===focal;
    boxes+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${sw}" height="${sh}" rx="8" fill="${f?'var(--dd-accent-tint)':'var(--dd-paper)'}" stroke="${f?'var(--dd-accent)':'var(--dd-ink)'}" stroke-width="${f?1.6:1}"/>`
      +`<text x="${cxk(k).toFixed(1)}" y="${(cyk(k)-4).toFixed(1)}" text-anchor="middle" font-family="Arial,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="${f?'var(--dd-accent)':'var(--dd-ink)'}">${st.name}</text>`
      +(st.sub?`<text x="${cxk(k).toFixed(1)}" y="${(cyk(k)+18).toFixed(1)}" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="var(--dd-muted)">${st.sub}</text>`:'');
  });
  const hubSvg=`<rect x="${cx-A}" y="${cy-B}" width="${2*A}" height="${2*B}" rx="8" fill="var(--dd-ink)" stroke="var(--dd-ink)"/>`
    +`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Arial,'Segoe UI',sans-serif" font-size="18" font-weight="800" fill="var(--dd-paper)">${opts.hub.name}</text>`
    +(opts.hub.sub?`<text x="${cx}" y="${cy+18}" text-anchor="middle" font-family="Consolas,monospace" font-size="11" fill="var(--dd-paper)" opacity=".82">${opts.hub.sub}</text>`:'');
  return `<svg class="dd-svg" viewBox="0 0 1040 700" role="img" aria-labelledby="${id}-t ${id}-d"><title id="${id}-t">${opts.hub.name} loop</title><desc id="${id}-d">Vòng lặp cải thiện quanh ${opts.hub.name}: ${stations.map(s=>s.name).join(' → ')}, mỗi bước ghi lại vào trung tâm dùng chung.</desc>`
    +`<defs><marker id="${id}-ra" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--dd-muted)"/></marker>`
    +`<marker id="${id}-sp" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,7 3,0 6" fill="var(--dd-soft)"/></marker></defs>`
    +ring+spokes+boxes+hubSvg+`</svg>`;
}
/* diagram-design: fan-in bottleneck — upstream fast lanes converge into one constrained stage, then drain. */
function bottleneckSvg(id,opts){
  const {upstream,neck,downstream,neckLabel}=opts;
  const vw=1040,vh=480,cyc=vh/2;
  const bx=70,bw=200,bh=64,gy=[cyc-150,cyc-50,cyc+50,cyc+150];
  const nx=vw/2-110,nw=220,nh=300,ny=cyc-nh/2;
  const dx=vw-70-200,dw=200,dh=64,dy=cyc-dh/2;
  let arrows='';
  // upstream -> neck (fan-in), attach points spread on neck left edge
  upstream.forEach((u,i)=>{const y1=gy[i]+bh/2,ax=bx+bw,ay=y1;
    const attachY=ny+nh*(i+1)/(upstream.length+1);
    const midx=(ax+nx)/2;
    arrows+=`<path d="M ${ax} ${ay} H ${midx-8} Q ${midx} ${ay} ${midx} ${ay+Math.sign(attachY-ay)*8} V ${attachY-Math.sign(attachY-ay)*8} Q ${midx} ${attachY} ${midx+8} ${attachY} H ${nx-2}" fill="none" stroke="var(--dd-muted)" stroke-width="1.4" marker-end="url(#${id}-a)"/>`;
  });
  // neck -> downstream single drain
  arrows+=`<path d="M ${nx+nw} ${cyc} H ${dx-2}" fill="none" stroke="var(--dd-accent)" stroke-width="1.8" marker-end="url(#${id}-ac)"/>`;
  const maskx=(nx+nw+dx)/2;
  arrows+=`<rect x="${maskx-46}" y="${cyc-26}" width="92" height="13" rx="2" fill="var(--dd-paper)"/><text x="${maskx}" y="${cyc-16}" text-anchor="middle" font-family="Consolas,monospace" font-size="11" letter-spacing=".06em" fill="var(--dd-accent)">DRAIN</text>`;
  let boxes='';
  upstream.forEach((u,i)=>{boxes+=`<rect x="${bx}" y="${gy[i]}" width="${bw}" height="${bh}" rx="6" fill="var(--dd-paper)" stroke="var(--dd-ink)" stroke-width="1"/>`
    +`<text x="${bx+bw/2}" y="${gy[i]+bh/2-2}" text-anchor="middle" font-family="Arial,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="var(--dd-ink)">${u.name}</text>`
    +(u.sub?`<text x="${bx+bw/2}" y="${gy[i]+bh/2+17}" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="var(--dd-muted)">${u.sub}</text>`:'');});
  // neck (focal, constrained)
  boxes+=`<rect x="${nx}" y="${ny}" width="${nw}" height="${nh}" rx="8" fill="var(--dd-accent-tint)" stroke="var(--dd-accent)" stroke-width="1.6"/>`
    +`<text x="${nx+nw/2}" y="${cyc-16}" text-anchor="middle" font-family="Arial,'Segoe UI',sans-serif" font-size="19" font-weight="800" fill="var(--dd-accent)">${neck.name}</text>`
    +(neck.sub?`<text x="${nx+nw/2}" y="${cyc+10}" text-anchor="middle" font-family="Consolas,monospace" font-size="12" fill="var(--dd-muted)">${neck.sub}</text>`:'')
    +(neckLabel?`<text x="${nx+nw/2}" y="${ny-14}" text-anchor="middle" font-family="Consolas,monospace" font-size="11" letter-spacing=".1em" fill="var(--dd-accent)">${neckLabel}</text>`:'');
  // downstream drain
  boxes+=`<rect x="${dx}" y="${dy}" width="${dw}" height="${dh}" rx="6" fill="var(--dd-paper)" stroke="var(--dd-ink)" stroke-width="1"/>`
    +`<text x="${dx+dw/2}" y="${dy+dh/2-2}" text-anchor="middle" font-family="Arial,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="var(--dd-ink)">${downstream.name}</text>`
    +(downstream.sub?`<text x="${dx+dw/2}" y="${dy+dh/2+17}" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="var(--dd-muted)">${downstream.sub}</text>`:'');
  return `<svg class="dd-svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-labelledby="${id}-t ${id}-d"><title id="${id}-t">${neck.name} bottleneck</title><desc id="${id}-d">Nhiều luồng ${upstream.map(u=>u.name).join(', ')} dồn vào một khâu giới hạn ${neck.name} rồi thoát ra ${downstream.name}.</desc>`
    +`<defs><marker id="${id}-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--dd-muted)"/></marker>`
    +`<marker id="${id}-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="var(--dd-accent)"/></marker></defs>`
    +arrows+boxes+`</svg>`;
}
/* diagram-design: two-axis line chart — scarcity vs scale; demand rises, cost falls, curves cross. */
function scarcitySvg(id,opts){
  const {rise,fall}=opts; // {label, color} each
  const vw=1040,vh=560, m={l:96,r:150,t:60,b:80};
  const x0=m.l,x1=vw-m.r,y0=vh-m.b,y1=m.t,W=x1-x0,H=y0-y1;
  const px=t=>x0+t*W, py=v=>y0-v*H; // t,v in 0..1
  // rising demand: gentle then steep (ease-in), falling cost: steep then flat (ease-out decay)
  const riseAt=t=>0.12+0.86*Math.pow(t,1.9);
  const fallAt=t=>0.86*Math.pow(1-t,1.7)+0.05;
  const path=fn=>{let d='';for(let i=0;i<=40;i++){const t=i/40;d+=(i?'L':'M')+px(t).toFixed(1)+' '+py(fn(t)).toFixed(1)+' '}return d.trim()};
  // gridlines
  let grid='';for(let i=1;i<=3;i++){const gy=y0-i*H/4;grid+=`<line x1="${x0}" y1="${gy.toFixed(1)}" x2="${x1}" y2="${gy.toFixed(1)}" stroke="var(--dd-soft)" stroke-width="1" stroke-dasharray="3,5" opacity=".45"/>`}
  // crossing point (numeric)
  let cross=0;for(let i=1;i<=200;i++){const t=i/200;if(riseAt(t)>=fallAt(t)){cross=t;break}}
  const cx=px(cross),cyv=py(riseAt(cross));
  const axes=`<line x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}" stroke="var(--dd-ink)" stroke-width="2.4"/>`
    +`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--dd-ink)" stroke-width="2.4"/>`
    +`<polygon points="${x0-6},${y1+10} ${x0+6},${y1+10} ${x0},${y1-2}" fill="var(--dd-ink)"/>`
    +`<polygon points="${x1-2},${y0-6} ${x1-2},${y0+6} ${x1+10},${y0}" fill="var(--dd-ink)"/>`;
  const axLabels=`<text x="${x0-14}" y="${y1+2}" text-anchor="end" font-family="Consolas,monospace" font-size="17" font-weight="700" fill="var(--dd-ink)">ĐỘ KHAN HIẾM ↑</text>`
    +`<text x="${x1}" y="${y0+34}" text-anchor="end" font-family="Consolas,monospace" font-size="17" font-weight="700" fill="var(--dd-ink)">QUY MÔ →</text>`;
  const curves=`<path d="${path(riseAt)}" fill="none" stroke="${rise.color}" stroke-width="4.5" stroke-linecap="round"/>`
    +`<path d="${path(fallAt)}" fill="none" stroke="${fall.color}" stroke-width="4.5" stroke-linecap="round"/>`;
  // crossing marker
  const mark=`<circle cx="${cx.toFixed(1)}" cy="${cyv.toFixed(1)}" r="7" fill="var(--dd-paper)" stroke="var(--dd-ink)" stroke-width="2.4"/>`
    +`<line x1="${cx.toFixed(1)}" y1="${cyv.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y0}" stroke="var(--dd-ink)" stroke-width="1.2" stroke-dasharray="4,4" opacity=".55"/>`
    +`<text x="${cx.toFixed(1)}" y="${y0+56}" text-anchor="middle" font-family="Consolas,monospace" font-size="13" letter-spacing=".05em" fill="var(--dd-muted)">ĐIỂM ĐẢO CHIỀU</text>`;
  // end labels
  const rEndY=py(riseAt(1)),fEndY=py(fallAt(1));
  const labels=`<text x="${x1+12}" y="${(rEndY+5).toFixed(1)}" font-family="Arial,'Segoe UI',sans-serif" font-size="16" font-weight="750" fill="${rise.color}">${rise.label}</text>`
    +`<text x="${x1+12}" y="${(fEndY+5).toFixed(1)}" font-family="Arial,'Segoe UI',sans-serif" font-size="16" font-weight="750" fill="${fall.color}">${fall.label}</text>`;
  return `<svg class="dd-svg" viewBox="0 0 ${vw} ${vh}" role="img" aria-labelledby="${id}-t ${id}-d"><title id="${id}-t">Khan hiếm theo quy mô</title><desc id="${id}-d">Khi quy mô tăng, ${rise.label} tăng dần và vượt lên trong khi ${fall.label} giảm dần; hai đường cắt nhau tại điểm đảo chiều.</desc>`
    +grid+axes+axLabels+curves+mark+labels+`</svg>`;
}
function badge(type,text){return `<span class="tag ${type}">${text}</span>`}
const slides=[
{sec:'MỞ ĐẦU',title:'Beyond AI Adoption',key:'From Individual Productivity to Harnessed Organization',cls:'dark',body:`<div style="display:grid;grid-template-columns:1.05fr .95fr;gap:70px;height:100%;align-items:center"><div><div class="label">SEMINAR CHUYÊN SÂU · 75–90 PHÚT</div><div class="big">What happens after everyone starts using AI?</div><p class="key">Từ sử dụng AI đại trà đến tổ chức vận hành AI có Harness</p></div><div class="stair" style="height:540px;transform:scale(.82);transform-origin:center bottom"><div class="s current">AI<br>Adoption<br><small>Current State</small></div><div class="s">AI<br>Workflow</div><div class="s">Shared<br>Harness</div><div class="s">Agent<br>Platform</div><div class="s">Measured<br>Autonomy</div></div></div>`,notes:`<b>Nói:</b> Phần lớn tổ chức bắt đầu bằng tool, license, đào tạo và khuyến khích sử dụng. Câu hỏi hôm nay không phải “Harness là gì?” mà là: nếu usage đã phổ biến, ta tiếp tục tăng usage hay thay đổi hệ thống thực thi công việc?<br><b>Chuyển:</b> Bắt đầu từ một nghịch lý: cá nhân nhanh hơn chưa chắc tổ chức nhanh hơn.`},
{sec:'PART 1 · AI ADOPTION IS ONLY STEP ONE',title:'AI Adoption ≠ Organizational Productivity',key:'Cá nhân nhanh hơn không có nghĩa Value Stream — Chuỗi giá trị nhanh hơn.',body:`<div style="position:absolute;right:0;top:-42px">${badge('illustrative','Ví dụ minh họa')}</div><div style="display:grid;grid-template-rows:1fr auto;gap:22px;height:100%"><div class="value-stream"><div class="stream"><h3>Trước AI · Tổng 18 ngày</h3><div class="seg"><span>Đặc tả yêu cầu</span><b>2d</b></div><div class="seg hot"><span>Lập trình</span><b>8d</b></div><div class="seg"><span>Kiểm duyệt (Review)</span><b>3d</b></div><div class="seg"><span>Kiểm thử (Test)</span><b>3d</b></div><div class="seg"><span>Phê duyệt</span><b>2d</b></div></div><div class="stream"><h3>Sau AI · Tổng 16 ngày</h3><div class="seg"><span>Đặc tả yêu cầu</span><b>2d</b></div><div class="seg fast"><span>Lập trình</span><b>1d</b></div><div class="seg hot"><span>Kiểm duyệt (Review)</span><b>6d</b></div><div class="seg hot"><span>Kiểm thử (Test)</span><b>5d</b></div><div class="seg"><span>Phê duyệt</span><b>2d</b></div></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px"><div class="card" style="text-align:center;padding:18px"><div style="font-size:44px;font-weight:800;color:var(--green)">−87%</div><div class="tiny">Thời gian lập trình<br>(8d → 1d, nhanh ~8×)</div></div><div class="card" style="text-align:center;padding:18px;border:3px solid var(--amber)"><div style="font-size:44px;font-weight:800;color:var(--amber)">−11%</div><div class="tiny">Tổng lead time<br>(18d → 16d)</div></div><div class="card" style="text-align:center;padding:18px"><div style="font-size:44px;font-weight:800;color:var(--red)">39% → 69%</div><div class="tiny">Tỷ trọng Review + Test<br>trong lead time</div></div></div></div>`,notes:`<b>Nói:</b> Đây là ví dụ minh họa, không phải dữ liệu doanh nghiệp. Lập trình nhanh gấp 8 lần (8 ngày còn 1 ngày) nhưng tổng lead time chỉ giảm 11% — từ 18 xuống 16 ngày. Lý do: AI tạo ra nhiều đầu ra hơn nên Kiểm duyệt và Kiểm thử phình từ 6 ngày lên 11 ngày, chiếm 69% lead time thay vì 39%. Nút thắt không biến mất, nó dịch chuyển từ Lập trình sang Kiểm chứng — đây là Bottleneck Shifting.<br><b>Chuyển:</b> DORA gọi AI là một amplifier của chính hệ thống hiện hữu.`},
{sec:'PART 1 · RESEARCH SIGNAL',title:'DORA 2025: AI Is an Amplifier',key:'AI không sửa organizational system; nó khuếch đại điểm mạnh và điểm yếu đang tồn tại.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Fact · DORA 2025 [7]')}</div><div class="compare"><div class="side"><div class="label">STRONG FOUNDATION</div><div class="stack"><div class="bar">Clear workflow</div><div class="bar">Good tests & fast feedback</div><div class="bar">Strong platform & APIs</div></div><div class="node focal" style="margin:30px auto;width:70%">AI → LEVERAGE</div></div><div class="vs">AI</div><div class="side"><div class="label">WEAK FOUNDATION</div><div class="stack"><div class="bar">Fragmented workflow</div><div class="bar">Weak tests & manual gates</div><div class="bar">Poor platform & tool sprawl</div></div><div class="node" style="margin:30px auto;width:70%;border-color:var(--red)">AI → AMPLIFIED DYSFUNCTION</div></div></div>`,notes:`<b>Nói:</b> DORA 2025 mô tả vai trò chính của AI là amplifier, phóng đại strengths và weaknesses của tổ chức. Giá trị không chỉ đến từ tool mà từ underlying organizational system.<br><b>Chuyển:</b> Vì vậy sau adoption, năm câu hỏi hệ thống trở nên quan trọng hơn câu hỏi về license.` ,src:[7]},
{sec:'PART 1 · THE FIVE QUESTIONS',title:'Five Questions After Adoption',key:'AI usage tăng buộc tổ chức phải thiết kế Work, Context, Control, Verification và Measurement.',body:`<div class="wheel"><div class="hub">AI<br>WORKFLOW</div><div class="w w1">WORK<br><small>AI nên làm việc nào?</small></div><div class="w w2">CONTEXT<br><small>Nguồn chuẩn ở đâu?</small></div><div class="w w3">CONTROL<br><small>Được phép làm gì?</small></div><div class="w w4">VERIFY<br><small>Biết đúng bằng cách nào?</small></div><div class="w w5">MEASURE<br><small>Outcome có cải thiện?</small></div></div><div class="card" style="position:absolute;right:20px;top:90px;width:470px"><p class="big" style="font-size:34px">Đây là điểm AI Adoption chuyển thành <span class="accent">Harness Engineering</span>.</p></div>`,notes:`<b>Nói:</b> Năm câu hỏi này không phải taxonomy tiêu chuẩn; đây là khung dẫn chuyện cho seminar. Chúng đưa ta từ “ai đang dùng gì?” sang “công việc được thực thi thế nào?”.<br><b>Chuyển:</b> Sáu tổ chức khác nhau đã đi vào cùng vùng vấn đề từ sáu hướng.`},
{sec:'PART 2 · INDUSTRY MAP',title:'Six Organizations, Different Problems, Same Direction',key:'Different implementations. Same emerging problem: làm sao để AI Agents hữu ích ở quy mô tổ chức?',body:`<div class="grid g3" style="height:100%"><div class="card"><div class="label">TIMEE · ORGANIZATION</div><h3>Adoption → Ownership</h3><p>Agent Harness Group</p></div><div class="card"><div class="label">OPENAI · ENGINEERING</div><h3>Agent-first work</h3><p>Environment as engineering</p></div><div class="card"><div class="label">ANTHROPIC · RELIABILITY</div><h3>Same model, new outcome</h3><p>Harness cost & evolution</p></div><div class="card"><div class="label">GOOGLE · RUNTIME</div><h3>Enterprise Harness</h3><p>State, tools, IAM, operations</p></div><div class="card"><div class="label">TALKDESK · DELIVERY</div><h3>Operating model</h3><p>Intent → reviewed PR</p></div><div class="card"><div class="label">DEEPSEEK · PLATFORM</div><h3>Explicit product layer</h3><p>Composable plugins + trace</p></div></div>`,notes:`<b>Nói:</b> Không xem đây là logo wall. Mỗi case trả lời một phần của progression: organization, engineering, reliability, runtime, delivery và platform architecture.<br><b>Chuyển:</b> Bắt đầu với Timee vì journey gần nhất với trạng thái “adoption đang thành công”.`,src:[1,2,3,4,5,6]},
{sec:'CASE · TIMEE',title:'Timee: AI Adoption Was Successful',key:'Chính adoption tăng nhanh đã làm lộ ra vấn đề của giai đoạn kế tiếp.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Fact · Timee [1]')}</div><div class="metricrow"><div class="metric hero"><b>1,4×</b><span>Claude Code users trong một tháng</span></div><div class="metric hero"><b>11×</b><span>Repositories sử dụng Skills</span></div></div><div class="diagram" style="height:330px;margin-top:30px">${flowSvg('timee-growth',['AI-DLC','Adoption ↑','Shared Skills','AI Practice'],1,['Intensive program','Usage expands','Repos encode practice','Beyond engineering'])}</div>`,notes:`<b>Nói:</b> Timee báo cáo sau AI-DLC program: Claude Code users tăng 1,4 lần trong một tháng và repositories với Skills tăng 11 lần. Đây là self-description của Timee; không dùng như benchmark phổ quát.<br><b>Chuyển:</b> Adoption không thất bại. Nhưng individual velocity không tự động trở thành organizational velocity.`,src:[1]},
{sec:'CASE · TIMEE',title:'Individual Speed ≠ Organizational Speed',key:'Coding nhanh hơn làm work-in-progress dồn về Review, Test và Approval.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Observed Pattern · Timee [1]')}</div><div class="bottle"><div class="pipe">REQUIREMENT</div><div class="arrow">››</div><div class="pipe fast">CODE</div><div class="arrow">››››</div><div class="pipe blocked">REVIEW<br><small>QUEUE ↑</small></div><div class="pipe blocked">TEST<br><small>VERIFY ↑</small></div><div class="pipe">RELEASE</div></div><div class="grid g3" style="position:absolute;left:80px;right:80px;bottom:10px"><div class="card"><h3>Bottleneck Shift</h3><p>Constraint moves downstream.</p></div><div class="card"><h3>Verification Cost</h3><p>Saved coding time is reinvested.</p></div><div class="card"><h3>Speed vs Safety</h3><p>Safety capability does not grow automatically.</p></div></div>`,notes:`<b>Nói:</b> Timee nêu ba challenge: bottleneck shifting, verification cost và nguy cơ speed/safety không cùng tiến hóa. Diagram dùng semantic fan-in/bottleneck nhưng không gán số capacity giả.<br><b>Chuyển:</b> Nếu human chỉ sửa từng output, tổ chức không tích lũy năng lực.`,src:[1]},
{sec:'CASE · TIMEE',title:'Human IN the Loop → Human ON the Loop',key:'Đừng chỉ sửa output; hãy sửa system tạo ra output.',body:`<div class="compare"><div class="side"><div class="label">HUMAN IN THE LOOP</div><div class="diagram" style="height:410px">${flowSvg('hitl',['Agent','Wrong Output','Human Fix','Done'],2)}</div><p class="tiny">Tác vụ sau có thể lặp lại cùng lỗi.</p></div><div class="vs">→</div><div class="side"><div class="label">HUMAN ON THE LOOP</div><div class="diagram" style="height:410px;padding:6px">${loopSvg('hotl',{hub:{name:'Harness',sub:'ghi lại mọi vòng'},focal:1,stations:[{name:'Failure',sub:'sự cố phát sinh'},{name:'Analyze',sub:'root cause'},{name:'Improve Harness',sub:'rule · tool · eval'},{name:'Future Runs',sub:'compounding'}]})}</div><p class="tiny">Correction trở thành Rule · Skill · Tool · Test · Gate · Context.</p></div></div>`,notes:`<b>Nói:</b> Timee phân biệt human review từng output với human cải thiện harness. “On the loop” không có nghĩa bỏ human; human chuyển sang thiết kế recurrence prevention.<br><b>Chuyển:</b> Khi những correction giống nhau xuất hiện ở nhiều team, ownership chung bắt đầu có ý nghĩa.`,src:[1]},
{sec:'CASE · TIMEE',title:'Timee Creates Agent Harness Group',key:'Khi Harness problems trở thành shared problems, tổ chức cần clear ownership.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Fact · Timee [1]')}</div><div class="diagram" style="height:330px">${flowSvg('timee-ahg',['Individual AI','Shared Skills','Repeated Problems','Shared Harness','AHG'],3)}</div><div class="grid g3" style="margin-top:24px"><div class="card"><h3>Productivity + Safety</h3><p>Co-evolve, not trade off.</p></div><div class="card"><h3>Measurable</h3><p>Track organizational outcome.</p></div><div class="card"><h3>Platform posture</h3><p>Enable safe autonomous operation.</p></div></div><p class="tiny">Caveat: Timee chọn AHG; tổ chức khác có thể giao capability cho AI Platform hoặc Developer Platform.</p>`,notes:`<b>Nói:</b> Timee công bố AHG với mission draft: xây platform cho AI workflows quanh Coding Agents, đo productivity và safety, thúc đẩy autonomous systems. Đây là một lựa chọn organization design, không phải template bắt buộc.<br><b>Chuyển:</b> OpenAI cho thấy cực điểm của agent-first engineering khi environment trở thành công việc chính.`,src:[1]},
{sec:'CASE · OPENAI',title:'OpenAI: Extreme Agent-first Engineering Experiment',key:'Self-reported experiment cho thấy throughput rất lớn — nhưng kết quả thuộc toàn bộ operating model, không riêng Harness.',body:`<div style="position:absolute;right:0;top:-42px">${badge('self','Self-reported · OpenAI [2]')}</div><div class="metricrow"><div class="metric hero"><b>~1M LOC</b><span>Sau khoảng 5 tháng</span></div><div class="metric"><b>~1.500</b><span>PR mở và merge</span></div><div class="metric"><b>3</b><span>kỹ sư ban đầu</span></div><div class="metric"><b>3,5</b><span>PR / engineer / day</span></div><div class="metric"><b>~1/10</b><span>estimated manual development time</span></div></div><div class="card" style="margin-top:28px"><p><b>Caveat:</b> internal experiment, 0 manually-written code constraint, model + tools + repo + feedback + operating model.</p></div>`,notes:`<b>Nói:</b> Đọc metric cùng caveat. OpenAI không đưa ra causal benchmark “Harness = 10×”. Họ ước tính xây sản phẩm trong khoảng một phần mười thời gian viết tay, với 1M LOC và 1.500 PR do nhóm nhỏ điều khiển Codex.<br><b>Chuyển:</b> Insight quan trọng nhất không phải LOC; đó là bottleneck chuyển sang thiết kế environment.`,src:[2]},
{sec:'CASE · OPENAI',title:'The Bottleneck Was Not Coding',key:'Engineer chuyển từ producing code sang designing the environment in which code is produced.',body:`<div class="compare"><div class="side"><div class="label">HUMAN-FIRST</div><div class="diagram" style="height:400px">${flowSvg('human-code',['Engineer','Code'],1)}</div></div><div class="vs">→</div><div class="side"><div class="label">AGENT-FIRST</div><div class="stack"><div class="bar">Context & Repository Knowledge</div><div class="bar">Tools & Runtime</div><div class="bar">Architecture & Tests</div><div class="bar">Feedback & Observability</div></div><div class="chain" style="height:160px"><div class="node">Engineer</div><div class="arrow">→</div><div class="node focal">Environment</div><div class="arrow">→</div><div class="node">Agent</div></div></div></div>`,notes:`<b>Nói:</b> OpenAI nói early progress chậm vì environment underspecified, thiếu tools, abstractions và internal structure. Khi failure xảy ra, câu hỏi là “capability nào thiếu, làm sao legible và enforceable cho agent?”.<br><b>Chuyển:</b> Environment chỉ hữu ích nếu Agent quan sát được nó.`,src:[2]},
{sec:'CASE · OPENAI',title:'Make the System Agent-legible',key:'Human-legible chưa đủ; Agent cần machine-readable access tới code, UI, logs, metrics và trace.',body:`<div style="display:grid;grid-template-columns:1fr .85fr;gap:50px;height:100%"><div class="wheel"><div class="hub">AGENT</div><div class="w w1">CODE<br><small>Repo + schema</small></div><div class="w w2">UI / DOM<br><small>Screenshot + CDP</small></div><div class="w w3">LOGS<br><small>LogQL</small></div><div class="w w4">METRICS<br><small>PromQL</small></div><div class="w w5">ARCHITECTURE<br><small>Versioned docs</small></div></div><div class="stack" style="justify-content:center"><div class="bar"><b>Human-legible</b><br><span class="tiny">Readable by people</span></div><div class="arrow" style="text-align:center">↓</div><div class="bar"><b>Machine-legible</b><br><span class="tiny">Structured & queryable</span></div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="border:3px solid var(--blue)"><b>Agent-legible</b><br><span class="tiny">Accessible in execution context</span></div></div></div>`,notes:`<b>Nói:</b> OpenAI nối Chrome DevTools Protocol, DOM snapshot, screenshots và local observability để Codex tự reproduce/validate. Knowledge ngoài repo hoặc không truy cập trong context gần như không tồn tại với Agent.<br><b>Chuyển:</b> Nhưng visibility không đủ; Anthropic cho thấy evaluator và orchestration thay đổi outcome — cùng model, khác harness.`,src:[2]},
{sec:'CASE · ANTHROPIC',title:'Anthropic: Same Model, Different Harness',key:'Harness nâng outcome nhưng phải trả bằng token, latency, complexity và infrastructure.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Experiment · Anthropic [3]')}</div><div class="compare"><div class="side"><h3>Solo Agent</h3><div class="metric"><b>20 min</b><span>Runtime</span></div><div class="metric" style="margin-top:14px"><b>~$9</b><span>Cost</span></div><div class="node" style="margin:24px auto;border-color:var(--red)">Outcome: broken core interaction</div></div><div class="vs">VS</div><div class="side"><h3>Full Harness</h3><div class="metric"><b>6 hr</b><span>Runtime</span></div><div class="metric" style="margin-top:14px"><b>~$200</b><span>Cost</span></div><div class="diagram" style="height:175px;margin-top:12px">${flowSvg('anthropic',['Planner','Generator','Evaluator'],1)}</div><div class="node focal" style="margin:8px auto">Outcome: working core</div></div></div>`,notes:`<b>Nói:</b> Với cùng Opus 4.5 và cùng prompt, solo run 20 phút/$9 nhưng core gameplay không hoạt động; full harness 6 giờ/$200 với Planner–Generator–Evaluator tạo app hoạt động tốt hơn. Không đồng nhất “đắt hơn” với “luôn tốt hơn”.<br><b>Chuyển:</b> Mỗi Harness component là một giả định về điểm yếu của model — giả định đó có thể hết hạn.`,src:[3]},
{sec:'CASE · ANTHROPIC',title:'Harness Must Evolve With Models',key:'Harness encodes assumptions about model weaknesses; model đổi thì control cũng phải được kiểm tra lại.',body:`<div style="display:grid;grid-template-columns:1fr 170px 1fr;gap:24px;height:405px"><div class="side"><div class="label">BEFORE · SONNET 4.5</div><h3 style="font-size:31px">Harness compensates for a weakness</h3><div class="node focal" style="margin:34px auto 24px;width:72%">CONTEXT RESET</div><p style="font-size:22px;line-height:1.45"><b>Load-bearing component</b><br><span class="tiny">Giúp giảm context anxiety trong long-running task.</span></p></div><div style="display:grid;place-items:center;text-align:center"><div><div class="label">MODEL EVOLVES</div><div style="font-size:72px;color:var(--blue);line-height:1">→</div><p style="font-size:22px;font-weight:750">Capability ↑<br>Scaffolding need ↓</p></div></div><div class="side"><div class="label">AFTER · OPUS 4.5</div><h3 style="font-size:31px">Re-test the assumption</h3><div class="node" style="margin:34px auto 24px;width:72%;border-style:dashed;color:var(--muted);text-decoration:line-through">CONTEXT RESET</div><div class="node focal" style="margin:0 auto;width:72%">REMOVED</div><p class="tiny" style="margin-top:18px;text-align:center">Same objective · Less unnecessary complexity</p></div></div><div class="diagram" style="height:225px;margin-top:22px">${flowSvg('evolve-harness',['Stress-test','Remove one','Measure impact','Keep minimum'],2,['Assumption','Component','Quality','Effective harness'])}</div>`,notes:`<b>Nói:</b> Anthropic mô tả context reset cần thiết với Sonnet 4.5 nhưng Opus 4.5 giảm context anxiety nên có thể bỏ reset trong harness mới. Với Opus 4.6, sprint decomposition cũng bớt load-bearing. Harness tốt biết xóa complexity.<br><b>Chuyển:</b> Google mở rộng góc nhìn từ coding sang enterprise runtime.`,src:[3]},
{sec:'CASE · GOOGLE',title:'Google: Agent Harness as Enterprise Runtime',key:'Harness nằm giữa Model và Enterprise Systems để quản lý state, tools, permission, testing và operation.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Fact · Google Cloud [4]')}</div><div class="chain"><div class="node darknode">FOUNDATION<br>MODEL</div><div class="arrow">→</div><div class="card" style="width:600px;border:3px solid var(--blue)"><div class="label">AGENT HARNESS</div><div class="grid g2"><div class="bar">State / Memory</div><div class="bar">Tool Execution</div><div class="bar">IAM / Guardrail</div><div class="bar">Testing / Eval</div><div class="bar">Monitoring / Trace</div><div class="bar">Runtime / Loop</div></div></div><div class="arrow">→</div><div class="stack"><div class="node">DATA</div><div class="node">APIs</div><div class="node">OPERATIONS</div></div></div>`,notes:`<b>Nói:</b> Google định nghĩa Harness là software environment bao quanh model, hỗ trợ tool interaction, memory và multi-step tasks; ở enterprise nó trở thành runtime/security layer giữa model và services.<br><b>Chuyển:</b> Shared primitives này không chỉ phục vụ coding.`,src:[4]},
{sec:'CASE · GOOGLE',title:'Google: Harness Is Not Just Coding',key:'Cùng một lớp Harness primitives có thể tái sử dụng ở nhiều business và technical domain.',body:`<div style="display:grid;grid-template-columns:1fr .82fr;gap:45px;height:100%"><div class="wheel"><div class="hub">AGENT<br>HARNESS</div><div class="w w1">DATA<br><small>BigQuery / Spanner</small></div><div class="w w2">SERVERLESS<br><small>Cloud Run</small></div><div class="w w3">GROUNDING<br><small>Knowledge + IAM</small></div><div class="w w4">DEVOPS<br><small>Logs + Monitoring</small></div><div class="w w5">MULTI-AGENT<br><small>State handoff</small></div></div><div class="stack" style="justify-content:center"><div class="bar"><b>Reusable primitives</b></div><div class="bar">Identity & permissions</div><div class="bar">State & handoff</div><div class="bar">Tool contracts</div><div class="bar">Trace & evaluation</div></div></div>`,notes:`<b>Nói:</b> Google liệt kê data retrieval, serverless agent microservices, enterprise grounding, DevOps diagnostics và multi-agent workflows. Shared Harness không đồng nghĩa one-size-fits-all workflow; nó là reusable primitives.<br><b>Chuyển:</b> DevOps use case minh họa rõ chuyển đổi từ suggestion sang evidence-based investigation.`,src:[4]},
{sec:'CASE · GOOGLE',title:'Google DevOps: Ask → Evidence-based Investigation',key:'Harness chuyển AI từ gợi ý sang điều tra có bằng chứng trong operational guardrails.',body:`<div class="compare"><div class="side"><div class="label">AI ASSISTANT</div><div class="diagram" style="height:410px">${flowSvg('assist',['Human asks','AI suggests','Human investigates'],1)}</div></div><div class="vs">→</div><div class="side"><div class="label">HARNESSED AGENT</div><div class="stack" style="width:78%;margin:16px auto"><div class="bar">01 · ALERT / INCIDENT</div><div class="bar">02 · READ METRICS</div><div class="bar">03 · INSPECT LOGS</div><div class="bar">04 · ANALYZE TRACE</div><div class="bar" style="border:3px solid var(--blue)">05 · FORM HYPOTHESIS</div></div><div class="node focal" style="margin:18px auto">Recommend controlled action</div></div></div>`,notes:`<b>Nói:</b> Google mô tả triage error spikes, analyze logs/traces và suggest remediation trong restricted operational guardrails. Slide không khẳng định auto-remediation production; mức action phụ thuộc permission và blast radius.<br><b>Chuyển:</b> Talkdesk đưa logic Harness vào toàn bộ software delivery operating model.`,src:[4]},
{sec:'CASE · TALKDESK',title:'Talkdesk: Agent Harness Delivery',key:'Harness trở thành Software Delivery Operating Model — từ intent đến reviewed pull request.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Fact · Talkdesk [5]')}</div><div class="diagram" style="height:340px">${flowSvg('ahd',['Story','Route','Analyze','Plan','Implement','Test'],4)}</div><div class="chain" style="height:180px"><div class="node focal">Open PR</div><div class="arrow">→</div><div class="node darknode">Human Review</div></div><div class="grid g4"><div class="card"><h3>Conventions</h3></div><div class="card"><h3>Skills / Tools</h3></div><div class="card"><h3>Guardrails</h3></div><div class="card"><h3>Orchestration</h3></div></div>`,notes:`<b>Nói:</b> Talkdesk định nghĩa workflow analyze–plan–implement–test–open PR, chạy isolated và giữ mandatory human reviews. Harness bao gồm conventions, tools, guardrails, orchestration và review gates.<br><b>Chuyển:</b> Operating model này phục vụ cả build lẫn operate.`,src:[5]},
{sec:'CASE · TALKDESK',title:'Talkdesk Use Cases: Build and Operate',key:'Harnessed workflow mở rộng từ feature delivery tới QA, bug fixing và incident diagnostics.',body:`<table class="table" style="height:100%;font-size:23px"><thead><tr><th></th><th>BUILD</th><th>OPERATE</th></tr></thead><tbody><tr><td><b>PLANNED</b></td><td><div class="focus">FEATURE DELIVERY</div>User Story → Technical Spec → Implementation → PR</td><td><div class="focus">QA</div>Requirement → Coverage → Test Generation → Diagnosis</td></tr><tr><td><b>REACTIVE</b></td><td><div class="focus">BUG FIX</div>Root Cause → Fix → Tested PR</td><td><div class="focus">RELIABILITY</div>Alert → Logs/Trace → Hypothesis → Controlled path</td></tr><tr><td><b>CONTINUOUS</b></td><td>Dependency/security patching<br>Tech-debt cleanup</td><td>Postmortem action → code change<br>Continuous security review</td></tr></tbody></table>`,notes:`<b>Nói:</b> Talkdesk nêu các workflow: story-to-implementation, bug root cause, documentation refresh, postmortem action-to-code, continuous security review, reliability triage và QA agents. Matrix tổ chức lại use cases; taxonomy Build/Operate là diễn giải của deck.<br><b>Chuyển:</b> Điều đáng chú ý là họ đo delivery outcome, không chỉ usage.`,src:[5]},
{sec:'CASE · TALKDESK',title:'Measure Outcomes, Not AI Usage',key:'Usage tells us adoption. Outcome tells us value.',body:`<div style="position:absolute;right:0;top:-42px">${badge('self','Internal observational data · Talkdesk [5]')}</div><div class="metricrow"><div class="metric hero"><b>~2×</b><span>PR throughput increase</span></div><div class="metric"><b>2–3%</b><span>Change Failure Rate</span></div><div class="metric"><b>1–2h</b><span>MTTR</span></div></div><div class="compare" style="height:300px;margin-top:28px"><div class="side"><div class="label">ADOPTION</div><h3>Active users · Invocations · Licenses</h3><p class="tiny">Cho biết mức sử dụng.</p></div><div class="vs">≠</div><div class="side"><div class="label">OUTCOME</div><h3>Throughput · Review · Failure · Restore</h3><p class="tiny">Cho biết value stream có tốt hơn không.</p></div></div><p class="tiny">Talkdesk mô tả correlation với agent invocation; deck không coi đó là causal proof độc lập.</p>`,notes:`<b>Nói:</b> Talkdesk báo cáo throughput gấp khoảng 2 lần, CFR 2–3% và MTTR 1–2 giờ trên dashboard nội bộ Jun 2025–May 2026. Chính bài viết dùng từ “direct correlation”; ta giữ caveat: observational company data, không phải controlled causal study.<br><b>Chuyển:</b> DeepSeek cho thấy Harness không chỉ là practice; nó trở thành product/platform layer rõ ràng.`,src:[5]},
{sec:'CASE · DEEPSEEK',title:'Harness Becomes an Explicit Platform Layer',key:'Agent = Model + Harness — capability được productize thành plugins và mọi run có trace.',body:`<div style="position:absolute;right:0;top:-42px">${badge('fact','Developer Preview · DeepSeek [6]')}</div><div style="display:grid;grid-template-columns:.75fr 1.25fr;gap:55px;height:100%;align-items:center"><div><div class="big" style="text-align:center">AGENT<br><span class="accent">=</span><br>MODEL<br><span class="accent">+</span><br>HARNESS</div></div><div><div class="node darknode" style="width:100%;font-size:30px">HARNESS CORE · CORDIS</div><div class="grid g3" style="margin-top:20px"><div class="bar">Models</div><div class="bar">Tools</div><div class="bar">Skills</div><div class="bar">Sessions</div><div class="bar">Sandboxes</div><div class="bar">Storage</div><div class="bar">Loops</div><div class="bar">Scheduling</div><div class="bar">UI</div></div><div class="node focal" style="margin:20px auto;width:70%">Append-only session log · Trace / Replay</div></div></div>`,notes:`<b>Nói:</b> DeepSeek Harness developer preview mô tả everything as a plugin: models, tools, skills, sessions, sandboxes, storage, loops, scheduling và UI. Mọi thứ model thấy được ghi vào append-only session log. Không dùng DeepSeek để chứng minh productivity result.<br><b>Chuyển:</b> Sáu case khác nhau, nhưng cùng đẩy kết luận từ tool sang system.`,src:[6]},
{sec:'PART 3 · CROSS-CASE SYNTHESIS',title:'Six Cases, Six Lessons',key:'Pattern chung: SYSTEM > TOOL.',body:`<table class="table" style="font-size:21px"><thead><tr><th>Organization</th><th>Primary lens</th><th>Main lesson</th></tr></thead><tbody><tr><td>Timee</td><td>Organization</td><td>Individual speed ≠ organizational speed</td></tr><tr><td>OpenAI</td><td>Engineering</td><td>Environment becomes engineering work</td></tr><tr><td>Anthropic</td><td>Reliability</td><td>Harness must evolve with Model</td></tr><tr><td>Google</td><td>Môi trường vận hành</td><td>Harness extends beyond coding</td></tr><tr><td>Talkdesk</td><td>Phân phối</td><td>Harness becomes operating model</td></tr><tr><td>DeepSeek</td><td>Architecture</td><td>Harness becomes explicit platform layer</td></tr></tbody></table><div style="position:absolute;right:30px;bottom:20px">${badge('interpret','Cross-case Interpretation')}</div>`,notes:`<b>Nói:</b> Đây là synthesis của deck, không phải taxonomy được sáu tổ chức cùng công bố. Mỗi case đóng một vai trò trong cùng progression: từ individual practice tới organizational capability.<br><b>Chuyển:</b> Pattern đầu tiên: bottleneck không biến mất; nó di chuyển.`,src:[1,2,3,4,5,6]},
{sec:'PATTERN #1',title:'Bottleneck Always Moves',key:'AI removes one constraint and exposes the next.',body:`<div style="position:absolute;right:0;top:-42px">${badge('interpret','Interpretation')}</div><div class="compare"><div class="side"><div class="label">BEFORE AI</div><div class="diagram" style="height:430px;padding:6px">${bottleneckSvg('before-b',{upstream:[{name:'Requirement',sub:'intake'},{name:'Review',sub:'nhanh'},{name:'Test',sub:'nhanh'},{name:'Release',sub:'phát hành'}],neck:{name:'Coding',sub:'khâu chậm nhất'},neckLabel:'CONSTRAINT',downstream:{name:'Throughput',sub:'giới hạn ở Coding'}})}</div></div><div class="vs">→</div><div class="side"><div class="label">AFTER AI</div><div class="diagram" style="height:430px;padding:6px">${bottleneckSvg('after-b',{upstream:[{name:'Requirement',sub:'intake'},{name:'Coding',sub:'AI tăng tốc'},{name:'Approval',sub:'nhanh'},{name:'Release',sub:'phát hành'}],neck:{name:'Review / Test',sub:'hàng chờ dồn lại'},neckLabel:'NEW CONSTRAINT',downstream:{name:'Throughput',sub:'giới hạn ở Verify'}})}</div></div></div>`,notes:`<b>Nói:</b> Dùng Theory of Constraints như lens: optimize local step không đảm bảo system throughput. Timee quan sát review/test bottleneck; OpenAI nói human QA capacity trở thành bottleneck.<br><b>Chuyển:</b> Khi bottleneck di chuyển, prompt dài hơn không giải quyết được system boundary.`,src:[1,2]},
{sec:'PATTERN #2',title:'Prompt → Context → Harness',key:'AI maturity không phải làm prompt dài hơn; nó mở rộng đối tượng thiết kế.',body:`<div style="position:absolute;right:0;top:-42px">${badge('interpret','Interpretation')}</div><div style="display:grid;grid-template-columns:1fr .85fr;gap:70px;height:100%;align-items:center"><div class="rings"><div class="ring outer"><span class="rtitle">HARNESS</span><span style="position:absolute;bottom:25px;font-size:21px">Tools · Policy · State · Feedback · Evaluation</span></div><div class="ring middle"><span class="rtitle">CONTEXT</span><span style="position:absolute;bottom:25px;font-size:21px">Code · Docs · Architecture · History</span></div><div class="ring inner"><span class="rtitle">PROMPT<br><small>Intent</small></span></div></div><div class="stack"><div class="bar"><b>Prompt Engineering</b><br><span class="tiny">Nói gì?</span></div><div class="bar"><b>Context Engineering</b><br><span class="tiny">Cung cấp thông tin nào?</span></div><div class="bar" style="border:3px solid var(--blue)"><b>Harness Engineering</b><br><span class="tiny">Toàn bộ execution environment hoạt động ra sao?</span></div></div></div>`,notes:`<b>Nói:</b> Timee diễn giải progression prompt→context→harness như các lớp bao hàm, không thay thế lẫn nhau. OpenAI cũng nhấn mạnh context có tổ chức và enforceable environment.<br><b>Chuyển:</b> Khi environment đảm nhận execution, vai trò human đi lên vòng lặp.`,src:[1,2]},
{sec:'PATTERN #3',title:'Human Work Moves Up the Loop',key:'Doing → Reviewing → Designing → Governing.',body:`<div style="position:absolute;right:0;top:-42px">${badge('interpret','Cross-case Interpretation')}</div><div class="stair" style="height:520px"><div class="s">EXECUTE<br><small>Do the task</small></div><div class="s">REVIEW<br><small>Check output</small></div><div class="s">DEFINE QUALITY<br><small>Evidence of done</small></div><div class="s">DESIGN HARNESS<br><small>Improve the system</small></div><div class="s">GOVERN<br><small>Set trust boundary</small></div></div><div class="chain" style="height:120px"><div class="node">Human IN the Loop</div><div class="arrow">→</div><div class="node focal">Human ON the Loop</div></div>`,notes:`<b>Nói:</b> OpenAI: humans steer, agents execute. Timee: human on the loop. Talkdesk: agents execute, human review remains for blast radius. Đây là chuyển dịch trọng tâm, không phải loại bỏ human.<br><b>Chuyển:</b> Khi generation tăng mạnh, verification và judgment trở thành nguồn lực khan hiếm.`,src:[1,2,5]},
{sec:'PATTERN #4',title:'AI Generates Cheaply; Verification Becomes Scarce',key:'Khi generation cost giảm, scarce resource có xu hướng chuyển sang verification và human judgment.',body:`<div style="position:absolute;right:0;top:-42px">${badge('hypothesis','Hypothesis')}</div><div style="display:grid;grid-template-columns:1fr 300px;gap:34px;height:calc(100% - 60px);margin-top:24px;align-items:center"><div class="diagram" style="height:100%">${scarcitySvg('scar',{rise:{label:'Nhu cầu kiểm chứng',color:'var(--red)'},fall:{label:'Chi phí tạo đầu ra bằng AI',color:'var(--blue)'}})}</div><div class="stack"><div class="card"><h3>Kiểm duyệt</h3><p class="tiny">Review gate vẫn bắt buộc</p></div><div class="card"><h3>Kiểm thử</h3><p class="tiny">Năng lực QA con người khan hiếm</p></div><div class="card"><h3>Phán đoán</h3><p class="tiny">Judgment thành nguồn lực khan hiếm</p></div></div></div>`,notes:`<b>Nói:</b> Đây là hypothesis dựa trên Timee verification cost, OpenAI human QA bottleneck, Anthropic evaluator cost và Talkdesk review/evaluation. Không nói là universal law. Khi chi phí tạo đầu ra (đường xanh) giảm theo quy mô, nhu cầu kiểm chứng (đường đỏ) lại tăng và vượt lên — tại điểm đảo chiều, kiểm chứng và phán đoán trở thành nguồn lực khan hiếm.<br><b>Chuyển:</b> Từ các pattern này, ta có thể đề xuất maturity model cho bước sau adoption.`,src:[1,2,3,5]},
{sec:'PART 4 · PROPOSED MODEL',title:'Proposed AI Maturity Model',key:'Access → Adoption → Workflow → Harness → Platform → Measured Autonomy.',body:`<div style="position:absolute;right:0;top:-42px">${badge('proposed','Proposed Model · Not Industry Standard')}</div><div class="ladder"><div class="level">L1<br>AI ACCESS<br><small>Có công cụ</small></div><div class="level">L2<br>AI ADOPTION<br><small>Nhiều người dùng</small></div><div class="level">L3<br>AI WORKFLOW<br><small>Use case lặp lại</small></div><div class="level">L4<br>HARNESSED<br><small>Context + Tools + Verify</small></div><div class="level">L5<br>SHARED PLATFORM<br><small>Runtime + Policy + Eval</small></div><div class="level">L6<br>MEASURED AUTONOMY<br><small>Trust by evidence</small></div></div><div class="tag fact" style="position:absolute;left:275px;bottom:25px">Current Organization: Level 1–2</div>`,notes:`<b>Nói:</b> Đây là mô hình đề xuất của seminar, không phải DORA hay industry standard. Current state theo brief là Level 1–2: access/adoption, có skills/workflows nhưng chưa có shared platform và chưa agentic autonomy đầy đủ.<br><b>Chuyển:</b> Vì vậy metric cũng phải chuyển từ usage sang outcome.`,src:[]},
{sec:'PART 4 · MEASUREMENT',title:'Stop Asking “How Many People Use AI?”',key:'Usage tells us adoption. Outcome tells us organizational value.',body:`<div class="compare"><div class="side"><div class="label">AI ADOPTION METRICS</div><div class="stack"><div class="bar">Active users</div><div class="bar">Licenses</div><div class="bar">Prompt / invocation count</div><div class="bar">AI usage hours</div></div><p class="tiny">Đo mức phổ biến.</p></div><div class="vs">→</div><div class="side"><div class="label">ORGANIZATIONAL OUTCOME METRICS</div><div class="grid g2"><div class="bar">Lead time</div><div class="bar">Throughput</div><div class="bar">Defect / Rework</div><div class="bar">Review time</div><div class="bar">Intervention rate</div><div class="bar">Verification pass</div><div class="bar">Change failure</div><div class="bar">Business outcome</div></div><p class="tiny">Đo value stream và reliability.</p></div></div>`,notes:`<b>Nói:</b> Usage metrics vẫn cần để quản lý adoption, nhưng không trả lời “AI có tạo value không?”. Talkdesk dùng PR throughput, PR size, review time và DORA metrics; Timee nhấn mạnh measurable productivity/safety.<br><b>Chuyển:</b> Trước khi build agent, phải chọn workflow phù hợp để đo và kiểm chứng.`,src:[1,5]},
{sec:'PART 4 · WORK SELECTION',title:'Select Workflows Before Building Agents',key:'Không hỏi “Agent nào ấn tượng?”; hỏi “Workflow nào có value cao và kiểm chứng rõ?”.',body:`<div style="position:absolute;right:0;top:-42px">${badge('proposed','Decision Framework')}</div><div class="quad" style="height:calc(100% - 65px);margin-top:25px"><div class="cross-x"></div><div class="cross-y"></div><div class="qitem pick" style="left:67%;top:14%">QA / Test</div><div class="qitem pick" style="left:72%;top:31%">Architecture Validation</div><div class="qitem pick" style="left:58%;top:42%">Coding</div><div class="qitem" style="left:60%;top:64%">DevOps Diagnostics</div><div class="qitem" style="left:25%;top:25%">Documentation</div><div class="qitem" style="left:17%;top:68%">Generic Research</div></div>`,notes:`<b>Nói:</b> Vị trí candidates là định tính minh họa, không phải scoring thực tế của tổ chức. Workflow đầu tiên nên có input rõ, expected outcome rõ, verification observable, tần suất cao và giá trị đáng kể.<br><b>Chuyển:</b> Skills có thể là capability trong workflow, nhưng không phải toàn bộ execution system.`},
{sec:'PART 4 · CAPABILITY STACK',title:'Skills Are Important — But Not the Whole System',key:'Bước maturity tiếp theo là đặt Skills vào workflow có context, controls và evidence.',body:`<div class="stack" style="width:1050px;margin:auto"><div class="bar" style="width:42%;margin:auto;text-align:center"><b>SKILL</b><br><span class="tiny">How to perform a capability</span></div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="width:60%;margin:auto;text-align:center"><b>WORKFLOW</b><br><span class="tiny">When / in which sequence</span></div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="width:80%;margin:auto;text-align:center;border:3px solid var(--blue)"><b>HARNESS</b><br><span class="tiny">Context + Tools + Controls + Evidence</span></div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="width:100%;margin:auto;text-align:center;background:var(--navy);color:#fff"><b>OUTCOME</b><br><span style="color:#b8c7d9">Was the work actually correct?</span></div></div>`,notes:`<b>Nói:</b> Không phủ định prompt hay skill. Skill đóng gói “how”; workflow đóng gói order/trigger; harness cung cấp environment và controls; outcome xác nhận value. Organizational capability cần cả stack.<br><b>Chuyển:</b> Từ đó hình thành roadmap bốn pha sau adoption.`},
{sec:'PART 5 · PROPOSED ROADMAP',title:'Roadmap After AI Adoption',key:'Observe → Harness → Platformize → Increase Autonomy.',body:`<div style="position:absolute;right:0;top:-42px">${badge('proposed','Proposed Roadmap')}</div><div class="roadmap"><div class="phase"><span class="time">0–3 MONTHS</span><h3>OBSERVE</h3><ul><li>Inventory use cases</li><li>Baseline value stream</li><li>Find bottlenecks</li><li>Define evidence of DONE</li><li>Capture repeated corrections</li></ul></div><div class="phase"><span class="time">3–6 MONTHS</span><h3>HARNESS</h3><ul><li>Standard workflow</li><li>Standard context</li><li>Tools & sandbox</li><li>Verification</li><li>Telemetry</li></ul></div><div class="phase"><span class="time">6–12 MONTHS</span><h3>PLATFORMIZE</h3><ul><li>Tool registry</li><li>Context infrastructure</li><li>Evaluation platform</li><li>Identity & policy</li><li>Golden paths</li></ul></div><div class="phase"><span class="time">12 MONTHS+</span><h3>AUTONOMY</h3><ul><li>Event-driven agents</li><li>Long-running workflow</li><li>Human-on-the-loop</li><li>Risk-based approval</li><li>Adaptive trust</li></ul></div></div>`,notes:`<b>Nói:</b> Timeline là đề xuất, không phải commitment. Mục tiêu 0–3 tháng không phải build platform mà đo current value stream, bottleneck và repeated correction. Chỉ platformize primitives đã chứng minh demand.<br><b>Chuyển:</b> Khi platformize, ownership cần tách rõ HOW và WHAT.`},
{sec:'PART 5 · OPERATING MODEL',title:'Proposed Operating Model',key:'Central capability sở hữu HOW Agents Work; Domain Teams sở hữu WHAT Agents Do.',body:`<div style="position:absolute;right:0;top:-42px">${badge('proposed','Proposed Operating Model')}</div><div class="node darknode" style="width:960px;margin:0 auto 22px;font-size:28px">AI / HARNESS PLATFORM</div><div class="grid g4" style="width:1300px;margin:auto"><div class="bar">Context</div><div class="bar">Tools</div><div class="bar">Runtime</div><div class="bar">Evaluation</div><div class="bar">Identity</div><div class="bar">Policy</div><div class="bar">Observability</div><div class="bar">Shared Standards</div></div><div class="chain" style="height:260px"><div class="node focal">DEV TEAM<br><small>Coding Agent</small></div><div class="node focal">OPS TEAM<br><small>Incident Agent</small></div><div class="node focal">ARCH TEAM<br><small>Architecture Agent</small></div></div><div class="compare" style="height:140px"><div class="side"><b>CENTRAL: HOW</b><br><span class="tiny">Paved road & shared controls</span></div><div class="vs">×</div><div class="side"><b>DOMAIN: WHAT</b><br><span class="tiny">Business semantics & outcomes</span></div></div>`,notes:`<b>Nói:</b> Không nhất thiết đặt tên Harness Team. Capability có thể nằm ở AI Platform, Developer Platform, Platform Engineering hoặc federated model. Central không build mọi agent; domain không tự dựng lại identity, sandbox và trace.<br><b>Chuyển:</b> Autonomy chỉ tăng khi evidence đáp ứng từng cấp trust.`},
{sec:'PART 5 · TRUST MODEL',title:'Autonomy Must Be Earned by Evidence',key:'Quyền tự chủ của Agent nên tăng theo reliability evidence — không theo cảm tính.',body:`<div style="position:absolute;right:0;top:-42px">${badge('proposed','Trust / Autonomy Ladder')}</div><div class="ladder" style="height:490px"><div class="level">L0<br>SUGGEST ONLY</div><div class="level">L1<br>GENERATE ARTIFACT</div><div class="level">L2<br>EXECUTE IN SANDBOX</div><div class="level">L3<br>CREATE PR / PROPOSE</div><div class="level">L4<br>REVERSIBLE ACTION</div><div class="level">L5<br>PRODUCTION ACTION</div></div><div class="chain" style="height:120px"><div class="tag">Evidence</div><div class="tag">Evaluation</div><div class="tag">Observability</div><div class="tag">Permission</div><div class="tag">Reliability History</div><div class="arrow">→</div><div class="tag fact">Higher Autonomy</div></div>`,notes:`<b>Nói:</b> Mỗi level cần policy riêng theo reversibility, blast radius và evidence. Read-only investigation có thể lên nhanh hơn production action. “Earned” nghĩa dựa trên pass rate, intervention, incident và rollback history.<br><b>Chuyển:</b> Nếu autonomy tăng, bottleneck tiếp theo có thể không còn là generation.`},
{sec:'PART 5 · FORWARD LOOK',title:'Predicted Next Bottleneck',key:'Khi generation ngày càng rẻ, Verification và Judgment có khả năng trở thành nguồn lực khan hiếm.',body:`<div style="position:absolute;right:0;top:-42px">${badge('hypothesis','Hypothesis')}</div><div class="diagram" style="height:340px">${flowSvg('migration',['Manual Work','AI Access','AI Coding','Verification','Architecture','Judgment'],3)}</div><div class="grid g4" style="margin-top:30px"><div class="card"><div class="label">TIMEE</div><p>Verification cost, bottleneck shift.</p></div><div class="card"><div class="label">OPENAI</div><p>Human QA capacity becomes scarce.</p></div><div class="card"><div class="label">ANTHROPIC</div><p>Evaluator adds value and cost.</p></div><div class="card"><div class="label">TALKDESK</div><p>Review gates remain non-negotiable.</p></div></div>`,notes:`<b>Nói:</b> Đây là dự báo có bằng chứng định hướng, không phải certainty. Nếu model và generation tiếp tục cải thiện, scarce resource sẽ dịch sang business judgment, architecture, test design và production safety.<br><b>Chuyển:</b> Kết luận seminar: đổi operating model, không chỉ tăng consumption.` ,src:[1,2,3,5]},
{sec:'CLOSING',title:'AI Adoption → AI Operating Model',key:'Bước tiếp theo không chỉ là sử dụng AI nhiều hơn; mà là thiết kế lại cách công việc được thực hiện quanh AI.',cls:'dark',body:`<div style="display:grid;grid-template-columns:1fr .9fr;gap:80px;height:100%;align-items:center"><div><div class="big">The next transformation is not about using more AI.</div><div class="big" style="margin-top:34px;color:#79b9eb">It is about redesigning work around AI.</div></div><div class="stack"><div class="bar" style="background:#fff;color:var(--ink)">USE AI</div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="background:#fff;color:var(--ink)">STANDARDIZE WORK</div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="background:#fff;color:var(--ink)">HARNESS AI</div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="background:#fff;color:var(--ink)">MEASURE OUTCOME</div><div class="arrow" style="text-align:center">↓</div><div class="bar" style="background:#1769aa;color:#fff">INCREASE TRUST → AUTONOMY</div></div></div>`,notes:`<b>Nói:</b> Mental model cuối: Use AI → Standardize Work → Harness AI → Measure Outcome → Increase Trust → Increase Autonomy. Adoption là điều kiện cần; trưởng thành tiếp theo là AI hoạt động trong workflow có context, verification, observability và governance.<br><b>Chuyển:</b> Appendix cung cấp matrix và evidence để thảo luận sâu.`},
{sec:'APPENDIX 1',title:'Organization Comparison Matrix',key:'Mỗi organization bắt đầu từ một constraint khác nhau nhưng cùng dịch chuyển từ tool sang system.',body:`<table class="table" style="font-size:16px"><thead><tr><th>Org</th><th>Starting problem</th><th>Harness approach</th><th>Reported / observed result</th><th>Lesson</th><th>Next step</th></tr></thead><tbody><tr><td>Timee</td><td>Adoption exposes bottlenecks</td><td>AHG + measurable co-evolution</td><td>1.4× users; 11× Skills repos</td><td>Shared problem needs owner</td><td>Harness coverage</td></tr><tr><td>OpenAI</td><td>Underspecified environment</td><td>Agent-legible repo/runtime</td><td>~1M LOC; ~1,500 PR</td><td>Environment is engineering</td><td>Encode judgment</td></tr><tr><td>Anthropic</td><td>Long-run coherence & QA</td><td>Planner/Generator/Evaluator</td><td>Working app at higher cost</td><td>Minimum effective harness</td><td>Remove stale controls</td></tr><tr><td>Google</td><td>Enterprise tool/action runtime</td><td>State, tools, IAM, monitoring</td><td>Use-case architecture</td><td>Shared primitives cross domains</td><td>Scale/govern</td></tr><tr><td>Talkdesk</td><td>Delivery throughput</td><td>AHD workflows + review gates</td><td>~2× throughput, internal data</td><td>Measure value stream</td><td>Expand to operations</td></tr><tr><td>DeepSeek</td><td>Composable agent runtime</td><td>Plugin architecture + event log</td><td>Developer preview</td><td>Harness is product layer</td><td>Ecosystem maturity</td></tr></tbody></table>`,notes:`<b>Nói:</b> Matrix tổng hợp; “Next step” là diễn giải từ nội dung nguồn, không phải cam kết chính thức của từng công ty. Nhắc lại phân loại evidence ở cột Result.<br><b>Chuyển:</b> Zoom vào journey Timee để thấy progression từ adoption tới ownership.`,src:[1,2,3,4,5,6]},
{sec:'APPENDIX 2',title:'Timee Detailed Journey',key:'Adoption success → bottleneck visibility → Harness Engineering → Agent Harness Group.',body:`<div class="diagram" style="height:390px">${flowSvg('timee-detail',['AI-DLC','Adoption ↑','Shared Skills','Bottlenecks','Harness','AHG'],4,['Jan 2026','1.4× users','11× repos','Review · Verify','Guides + Sensors','May 2026'])}</div><div class="grid g3" style="margin-top:24px"><div class="card"><h3>Accelerate</h3><p>Increase useful capability.</p></div><div class="card"><h3>Govern</h3><p>Measure productivity + safety.</p></div><div class="card"><h3>Cultivate</h3><p>Build on-the-loop culture.</p></div></div><p class="tiny">AHG mission and actions were described as draft / launch-phase plans by Timee.</p>`,notes:`<b>Nói:</b> Timee nói AHG sẽ launch 1/5/2026. Ba pillars Accelerate–Govern–Cultivate co-evolve qua OODA. “May 2026” là announced launch date; bài đăng đề ngày 21/4/2026.<br><b>Chuyển:</b> Appendix tiếp theo giữ metric OpenAI cùng caveat để tránh overclaim.`,src:[1]},
{sec:'APPENDIX 3',title:'OpenAI Metrics + Caveats',key:'Các metric mạnh, nhưng provenance là internal experiment và không tách riêng causal effect của Harness.',body:`<div class="metricrow"><div class="metric hero"><b>~1M LOC</b><span>Order of magnitude after 5 months</span></div><div class="metric"><b>~1,500</b><span>PRs</span></div><div class="metric"><b>3 → 7</b><span>Team grew</span></div><div class="metric"><b>3.5</b><span>PR / engineer / day</span></div><div class="metric"><b>~1/10</b><span>Estimated time</span></div></div><table class="table" style="margin-top:24px"><thead><tr><th>What the source supports</th><th>What the deck does NOT claim</th></tr></thead><tbody><tr><td>All code generated by Codex; humans steer.</td><td>Harness alone caused 10× productivity.</td></tr><tr><td>Environment, tools, docs, tests and observability were engineered.</td><td>Results generalize without similar investment.</td></tr><tr><td>Human QA became a bottleneck.</td><td>LOC is equivalent to customer value.</td></tr></tbody></table>`,notes:`<b>Nói:</b> OpenAI explicitly warns that end-to-end behavior depends heavily on repository structure/tooling and should not be assumed to generalize. Metric slide is self-reported evidence, not independent benchmarking.<br><b>Chuyển:</b> Google architecture cho thấy những primitives cần cho enterprise runtime.`,src:[2]},
{sec:'APPENDIX 4',title:'Google Harness Architecture — KNOW / DO / CONTROL / LEARN',key:'KNOW / DO / CONTROL / LEARN là mapping của seminar lên các capability Google mô tả.',body:`<div style="position:absolute;right:0;top:-42px">${badge('interpret','Interpretation · Mapping')}</div><div class="node darknode" style="width:360px;margin:0 auto 18px">FOUNDATION MODEL</div><div class="arrow" style="text-align:center">↓</div><div class="grid g4"><div class="card"><div class="label">BIẾT · Know</div><h3>State / Memory</h3><p>Grounding · Context · Handoff</p></div><div class="card"><div class="label">LÀM · Do</div><h3>Tool Execution</h3><p>MCP · APIs · Cloud Run</p></div><div class="card"><div class="label">KIỂM SOÁT · Control</div><h3>IAM / Guardrail</h3><p>Permission · Restricted action</p></div><div class="card"><div class="label">HỌC · Learn</div><h3>Trace / Evaluation</h3><p>Monitor · Test · Evidence</p></div></div><div class="arrow" style="text-align:center">↓</div><div class="chain" style="height:155px"><div class="node">DATA</div><div class="node">APIs</div><div class="node">OPERATIONS</div><div class="node">MULTI-AGENT</div></div>`,notes:`<b>Nói:</b> Google không trình bày taxonomy KNOW/DO/CONTROL/LEARN; deck dùng framework từ seminar trước để map state/memory, tools, IAM/guardrails, monitoring/testing. Đây là bridge cho người đã học seminar Harness.<br><b>Chuyển:</b> Nếu audience chưa dự seminar trước, slide recap cung cấp định nghĩa tối thiểu.`,src:[4]},
{sec:'APPENDIX 5',title:'Harness Concept Recap',key:'Harness là environment giúp Agent biết, làm, kiểm soát và học từ execution.',body:`<div class="grid g4" style="height:100%"><div class="card" style="border-top:7px solid #3f88c5"><div class="label">BIẾT · Know</div><h3>Context / Memory</h3><p>Agent biết gì và biết lấy thông tin chuẩn ở đâu?</p></div><div class="card" style="border-top:7px solid #16866a"><div class="label">LÀM · Do</div><h3>Tools / Runtime</h3><p>Agent có thể hành động nào trong environment?</p></div><div class="card" style="border-top:7px solid #b97808"><div class="label">KIỂM SOÁT · Control</div><h3>Policy / Permission</h3><p>Hành động nào được phép, trong blast radius nào?</p></div><div class="card" style="border-top:7px solid #7f5c9a"><div class="label">HỌC · Learn</div><h3>Evaluation / Trace</h3><p>Làm sao biết đúng, truy vết và cải thiện?</p></div></div>`,notes:`<b>Nói:</b> Recap ngắn, không biến seminar này thành khóa Harness cơ bản. Mục tiêu chỉ tạo common language cho phần thảo luận.<br><b>Chuyển:</b> Kết thúc bằng năm câu hỏi áp dụng trực tiếp vào tổ chức.`},
{sec:'Q&A · DISCUSSION',title:'Five Questions for the Organization',key:'Từ seminar sang hành động: chọn workflow, evidence, ownership và trust boundary.',cls:'ice',body:`<div class="grid g2" style="height:100%"><div class="card"><h3>01 · AI adoption có thành công?</h3><p>Nếu coding nhanh 3× nhưng end-to-end lead time không giảm?</p></div><div class="card"><h3>02 · Correction nào đang lặp?</h3><p>Có thể chuyển thành Rule, Skill, Tool, Test, Gate hay Evaluator nào?</p></div><div class="card"><h3>03 · Workflow nào đủ Verifiable?</h3><p>Để tăng Agent Autonomy trước tiên?</p></div><div class="card"><h3>04 · Ai sở hữu shared primitives?</h3><p>Context, Tools, Evaluation, Policy và Observability?</p></div><div class="card" style="grid-column:span 2"><h3>05 · Điều kiện nào để Human-in-the-loop → Human-on-the-loop?</h3><p>Evidence, reversibility, permission và reliability history nào phải đạt?</p></div></div>`,notes:`<b>Nói:</b> Chọn 2–3 câu phù hợp thời gian. Đừng kết thúc bằng “cần platform ngay”; kết thúc bằng workflow cụ thể, baseline cụ thể và evidence of DONE cụ thể.<br><b>Kết:</b> Khuyến khích dùng AI là bước đầu. Trưởng thành tiếp theo là biến AI thành phần của hệ thống thực thi công việc có đo lường và kiểm soát.`}
];

function localize(text){const chosen=[];for(const [source,target] of viPairs){const escaped=source.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const startsWord=/[\p{L}\p{N}_]/u.test(source[0]);const endsWord=/[\p{L}\p{N}_]/u.test(source[source.length-1]);const pattern=`${startsWord?'(?<![\\p{L}\\p{N}_])':''}${escaped}${endsWord?'(?![\\p{L}\\p{N}_])':''}`;for(const match of text.matchAll(new RegExp(pattern,'gu'))){const start=match.index,end=start+match[0].length;if(!chosen.some(item=>start<item.end&&end>item.start))chosen.push({start,end,target})}}chosen.sort((a,b)=>a.start-b.start);let result='',cursor=0;for(const item of chosen){result+=text.slice(cursor,item.start)+item.target;cursor=item.end}return result+text.slice(cursor)}
slides.forEach(s=>{for(const field of ['sec','title','key','body','notes'])s[field]=localize(s[field]||'')});
const deck=document.getElementById('deck');
function srcHTML(ids=[]){return ids.map(id=>`<a href="${sources[id][1]}" target="_blank" rel="noreferrer">[${id}] ${sources[id][0].split(' — ')[0]}</a>`).join('')}
slides.forEach((s,i)=>{const el=document.createElement('section');el.className=`slide ${s.cls||''}`;el.dataset.title=s.title;el.innerHTML=`<p class="chapter editable">${s.sec}</p><h2 class="headline editable">${s.title}</h2><p class="key editable">${s.key}</p><div class="canvas editable">${s.body}</div><aside class="source-links">${(s.src||[]).join(',')}</aside><footer class="footer"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${s.sec}</span><span class="src">${srcHTML(s.src)}</span></footer>`;[...el.querySelectorAll('.editable')].forEach((n,j)=>{n.dataset.storeKey=`beyond-ai-vi-edit-${i}-${j}`;const saved=localStorage.getItem(n.dataset.storeKey);if(saved!==null)n.innerHTML=saved});deck.appendChild(el)});
const els=[...document.querySelectorAll('.slide')];let index=Math.max(0,Math.min(els.length-1,Number(localStorage.getItem('beyond-ai-index')||0))),edit=false;
function scale(){const vv=window.visualViewport,w=vv?.width||innerWidth,h=vv?.height||innerHeight;const s=Math.min(w/1920,h/1080);deck.style.transform=`translate(-50%,-50%) scale(${s})`}
function render(){els.forEach((e,i)=>e.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${els.length}`;progress.style.width=`${(index+1)/els.length*100}%`;notesText.innerHTML=slides[index].notes;localStorage.setItem('beyond-ai-index',index)}
function go(n){index=Math.max(0,Math.min(els.length-1,n));render()}
function typing(){const a=document.activeElement;return a&&(a.matches('input,textarea')||a.isContentEditable)}
prev.onclick=()=>go(index-1);next.onclick=()=>go(index+1);notesBtn.onclick=()=>notes.classList.toggle('open');editBtn.onclick=()=>{edit=!edit;document.body.classList.toggle('edit-on',edit);document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit)};
addEventListener('keydown',e=>{if(typing())return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(els.length-1);if(e.key.toLowerCase()==='n')notes.classList.toggle('open');if(e.key.toLowerCase()==='e')editBtn.click()});
document.addEventListener('input',e=>{if(edit&&e.target.classList.contains('editable')&&e.target.dataset.storeKey)localStorage.setItem(e.target.dataset.storeKey,e.target.innerHTML)});
addEventListener('resize',scale);window.visualViewport?.addEventListener('resize',scale);scale();render();
</script>
</body>
</html>
