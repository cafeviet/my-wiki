<script>
const sources={
1:['Google Cloud — What is an agent harness?','https://cloud.google.com/discover/agent-harness'],
2:['OpenAI — Harness engineering','https://openai.com/index/harness-engineering/'],
3:['Anthropic — Harness design for long-running apps','https://www.anthropic.com/engineering/harness-design-long-running-apps'],
4:['DeepSeek Harness','https://www.deepseek.com/harness/en/'],
5:['Talkdesk — Agent Harness Delivery','https://www.talkdesk.com/blog/from-writing-code-directing-work-agent-harness-delivery/'],
6:['Timee — Agent Harness Group','https://productpr.timee.co.jp/n/n99011b2a6947?hl=en']};
const slides=[
{sec:'MỞ ĐẦU',title:'AI Agent & Harness',key:'From Model Intelligence to Reliable Agent Execution',cls:'dark',body:`<div style="display:grid;grid-template-columns:1.15fr .85fr;gap:80px;height:100%;align-items:center"><div><div class="kicker">SEMINAR CHUYÊN SÂU · 60–90 PHÚT</div><div class="bigquote" style="margin-top:28px">Khi AI chuyển từ <span class="accent">“trả lời”</span> sang <span class="accent">“hành động”</span>, chúng ta phải thiết kế môi trường mà AI hành động trong.</div><p class="key">Từ trí thông minh Model đến khả năng thực thi Agent đáng tin cậy</p></div><div class="down"><div class="node soft">MODEL<br><span class="tiny">THINK</span></div><div class="arrow">↓</div><div class="node core">AGENT<br><span style="font-size:16px">ACT</span></div><div class="arrow">↓</div><div class="node soft">HARNESS<br><span class="tiny">OPERATE RELIABLY</span></div></div></div>`,notes:`Mở đầu bằng chuyển dịch hành vi, không bắt đầu bằng định nghĩa. Khi mô hình chỉ tạo văn bản, con người còn là lớp thực thi. Khi hệ thống tự gọi tool, sửa code, truy cập dữ liệu hoặc gửi email, rủi ro không còn nằm ở câu chữ mà nằm ở hậu quả. Seminar sẽ chứng minh Harness xuất hiện tự nhiên từ chính bản chất vòng lặp Agent.`},
{sec:'CHƯƠNG I · TỪ LLM ĐẾN AGENT',title:'The Shift: Output → Action',key:'LLM tạo output. Agent theo đuổi goal thông qua action.',body:`<div class="compare"><div class="side"><div class="label">LLM · Large Language Model</div><div class="down" style="margin-top:70px"><div class="node">Prompt</div><div class="arrow">↓</div><div class="node core">Model</div><div class="arrow">↓</div><div class="node">Response</div></div><p class="tiny" style="text-align:center;margin-top:42px">Human đọc → Human hành động</p></div><div class="vs">VS</div><div class="side"><div class="label">AI Agent · Tác nhân AI</div><div class="flow" style="height:420px"><div class="loop" style="transform:scale(.72)"><div class="ring"></div><div class="node n1">Goal</div><div class="node n2">Observe</div><div class="node n3">Reason</div><div class="node n4">Act</div><div class="node n5">Environment</div><div class="center">FEEDBACK ↺</div></div></div><p class="tiny" style="text-align:center">Agent quan sát → hành động → nhận phản hồi → lặp</p></div></div>`,notes:`Điểm khác biệt không phải Agent “thông minh hơn” LLM. Agent là cách đóng gói năng lực mô hình vào một vòng lặp hướng mục tiêu. Human có thể vẫn phê duyệt, nhưng hệ thống đã có khả năng tạo tác động trực tiếp lên environment. Đây là lý do phần còn lại của kiến trúc trở nên quan trọng.`},
{sec:'CHƯƠNG I · TỪ LLM ĐẾN AGENT',title:'Agent = Goal-directed Loop',key:'Ba thuộc tính làm Agent khác một lần gọi Model: Goal, Action và Feedback Loop.',body:`<div style="display:grid;grid-template-columns:1fr .85fr;gap:80px;height:100%;align-items:center"><div class="loop"><div class="ring"></div><div class="node n1">GOAL</div><div class="node n2">OBSERVE</div><div class="node n3">REASON / PLAN</div><div class="node n4">ACT</div><div class="node n5">ENVIRONMENT</div><div class="center">OBSERVATION<br>↺</div></div><div class="grid"><div class="card"><div class="label">01 · Goal — Mục tiêu</div><p>Đích cần đạt, không chỉ prompt cần trả lời.</p></div><div class="card"><div class="label">02 · Action — Hành động</div><p>Thay đổi hoặc truy vấn environment qua tool.</p></div><div class="card"><div class="label">03 · Feedback Loop — Vòng phản hồi</div><p>Kết quả trở thành observation cho quyết định tiếp theo.</p></div></div></div>`,notes:`Nhấn mạnh vòng lặp có thể rất ngắn hoặc kéo dài nhiều giờ. Một agent đơn giản có thể chỉ gọi một API; agent tự chủ có thể lập kế hoạch, chia task, thử lại và phục hồi. Chính vòng lặp làm lỗi có thể tích lũy, vì observation sai sẽ dẫn đến re-plan sai.`},
{sec:'CHƯƠNG I · TỪ LLM ĐẾN AGENT',title:'Model Intelligence ≠ Agent Capability',key:'Model có thể quyết định — nhưng tự nó không có quyền, trạng thái hay cơ chế thực thi.',body:`<div style="position:relative;height:100%"><div class="node core" style="position:absolute;left:calc(50% - 145px);top:205px;width:290px;height:120px;display:grid;place-items:center">MODEL</div><div class="node" style="position:absolute;left:120px;top:30px">Database?</div><div class="node" style="position:absolute;right:120px;top:30px">Git?</div><div class="node" style="position:absolute;left:25px;bottom:80px">API / Shell?</div><div class="node" style="position:absolute;right:25px;bottom:80px">Memory / State?</div><div class="node" style="position:absolute;left:calc(50% - 120px);bottom:0">Permission?</div><svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 1700 690"><g stroke="#7ca7da" stroke-width="3" stroke-dasharray="10 9"><line x1="850" y1="265" x2="285" y2="95"/><line x1="850" y1="265" x2="1415" y2="95"/><line x1="850" y1="265" x2="220" y2="555"/><line x1="850" y1="265" x2="1480" y2="555"/><line x1="850" y1="265" x2="850" y2="650"/></g></svg></div>`,notes:`Mô hình có năng lực hiểu, reasoning, planning và decision-making. Nhưng capability hệ thống không tự sinh ra từ weights. Truy cập Git, database, memory hay permission đều là quyết định kiến trúc và vận hành. Câu chuyển: thứ gì biến intent của Model thành action thực tế mà vẫn kiểm soát được?`},
{sec:'CHƯƠNG II · HARNESS LÀ GÌ?',title:'The Missing Layer: Agent Harness',key:'Model decides. Harness enables and controls execution.',body:`<div class="arch"><div class="down"><div class="node">GOAL</div><div class="arrow">↓</div><div class="node core">MODEL</div><div class="tiny">Intent / Action</div></div><div class="harness"><div class="label">AGENT HARNESS · BỘ KHUNG AGENT</div><div class="stack"><div class="bar">Context · Tools · State</div><div class="bar">Memory · Runtime · Loop</div><div class="bar">Identity · Permission · Isolation</div><div class="bar">Feedback · Evidence · Trace</div></div></div><div class="down"><div class="node">ENVIRONMENT</div><div class="arrow">↓</div><div class="node soft">OUTCOME</div></div></div>`,notes:`Định nghĩa làm việc: Harness là software environment bao quanh model, biến intent thành execution và trả observation về model. Nó vừa cấp năng lực, vừa thiết lập boundary. Không nên vẽ Harness như một box duy nhất trong mọi implementation; đây là logical layer có thể trải trên runtime, SDK, platform, policy plane và observability.`},
{sec:'CHƯƠNG II · HARNESS LÀ GÌ?',title:'Google: software environment around the model',key:'Harness kết nối tool, duy trì state/memory và hỗ trợ multi-step task trong hệ thống lớn hơn.',body:`<div style="display:grid;grid-template-columns:1.05fr .95fr;gap:55px;height:100%"><div class="card" style="padding:44px"><span class="tag fact">Fact · Google Cloud [1]</span><div class="bigquote" style="font-size:42px;margin-top:28px">“A software environment that surrounds an artificial intelligence model…”</div><p class="key" style="font-size:25px">…giúp model tương tác tool bên ngoài, nhớ tương tác trước và thực thi tác vụ nhiều bước.</p></div><div class="down"><div class="node core">MODEL</div><div class="arrow">↓ request</div><div class="node" style="width:330px">HARNESS<br><span class="tiny">tool execution + state</span></div><div class="arrow">↓</div><div class="node soft">TOOL / API</div><div class="arrow">↑ result / observation</div></div></div>`,notes:`Đây là định nghĩa chính thức của Google Cloud tại thời điểm truy xuất. Điểm quan trọng là Google mô tả Harness như environment, không chỉ là guardrail. Google cũng nhấn mạnh MCP cho kết nối tool, state/memory, reliability, visibility và testing. Không nên hiểu đây là tiêu chuẩn duy nhất của ngành.`,src:[1]},
{sec:'CHƯƠNG II · HARNESS LÀ GÌ?',title:'DeepSeek: Agent = Model + Harness',key:'Harness là abstraction rộng cho Agent Architecture — không chỉ Coding Agent.',body:`<div style="display:grid;grid-template-columns:.8fr 1.2fr;gap:60px;height:100%;align-items:center"><div><span class="tag fact">Fact · DeepSeek [4]</span><div class="equation" style="margin-top:55px">AGENT<br><span class="accent">=</span><br>MODEL<br><span class="accent">+</span><br>HARNESS</div></div><div class="grid g3"><div class="card"><h3>Tools</h3><p>Capabilities</p></div><div class="card"><h3>Skills</h3><p>Reusable behavior</p></div><div class="card"><h3>Sessions</h3><p>Continuity</p></div><div class="card"><h3>Sandboxes</h3><p>Isolation</p></div><div class="card"><h3>Storage</h3><p>Persistence</p></div><div class="card"><h3>Loops</h3><p>Execution</p></div><div class="card"><h3>Scheduling</h3><p>Autonomy</p></div><div class="card"><h3>UI</h3><p>Interaction</p></div><div class="card"><h3>Trace</h3><p>Observability</p></div></div></div>`,notes:`DeepSeek Harness dùng đúng mental model “Agent = Model + Harness” và liệt kê models, tools, skills, sessions, sandboxes, storage, loops, scheduling và UI như plugin capabilities. Đây là bằng chứng rõ rằng Harness rộng hơn một workflow. Tuy nhiên, đây cũng là quan điểm sản phẩm/kiến trúc của DeepSeek, không phải định nghĩa pháp quy.`,src:[4]},
{sec:'CHƯƠNG II · HARNESS LÀ GÌ?',title:'Harness ≠ một thành phần đơn lẻ',key:'Prompt, workflow, CI/CD, gate và tool calling có thể nằm trong Harness — nhưng không thành phần nào đại diện cho toàn bộ Harness.',body:`<div style="display:grid;grid-template-columns:.75fr 1.25fr;gap:50px;height:100%"><div class="stack" style="justify-content:center"><div class="bar">HARNESS ≠ PROMPT</div><div class="bar">HARNESS ≠ WORKFLOW</div><div class="bar">HARNESS ≠ CI/CD</div><div class="bar">HARNESS ≠ GATE</div><div class="bar">HARNESS ≠ TOOL CALLING</div></div><div class="compare"><div class="side"><div class="label">ENABLE · Trao năng lực</div><h3 style="font-size:34px">Agent làm được gì?</h3><div class="stack"><div class="bar">Context</div><div class="bar">Tools / Runtime</div><div class="bar">Memory / State</div></div></div><div class="vs">+</div><div class="side"><div class="label">CONTROL · Kiểm soát</div><h3 style="font-size:34px">Agent làm như thế nào?</h3><div class="stack"><div class="bar">Identity / Policy</div><div class="bar">Isolation / Gate</div><div class="bar">Verification / Trace</div></div></div></div></div>`,notes:`Đây là slide phá ngộ nhận. Guardrail chỉ thiên về control; tool calling chỉ thiên về enable; workflow mô tả trình tự; CI/CD thường kiểm soát artifact. Harness bao trùm môi trường thực thi. Trong implementation cụ thể, boundary có thể khác nhau và các lớp có thể overlap.`},
{sec:'CHƯƠNG II · FRAMEWORK TRUNG TÂM',title:'KNOW / DO / CONTROL / LEARN',key:'Bốn câu hỏi để thiết kế Harness từ nhu cầu vận hành, không từ danh sách công nghệ.',cls:'ice',body:`<span class="tag proposed">Proposed Framework · Không phải taxonomy chính thức</span><div class="quad" style="margin-top:22px;height:570px"><div class="q know"><h3>KNOW · BIẾT</h3><p>Agent biết gì?</p><p><b>Context · Knowledge · Memory</b></p></div><div class="q do"><h3>DO · LÀM</h3><p>Agent làm được gì?</p><p><b>Tools · API · Runtime · Environment</b></p></div><div class="q control"><h3>CONTROL · KIỂM SOÁT</h3><p>Agent được phép làm gì?</p><p><b>Identity · Permission · Policy · Isolation</b></p></div><div class="q learn"><h3>LEARN · PHẢN HỒI</h3><p>Làm sao biết Agent có làm đúng?</p><p><b>State · Trace · Evaluation · Evidence</b></p></div></div>`,notes:`Cần chủ động nói đây là framework tổng hợp của seminar để giúp reasoning về Harness, không phải taxonomy của Google, OpenAI hay Anthropic. KNOW bao gồm thông tin agent cần; DO là capability; CONTROL là authority và boundary; LEARN là vòng đo lường, bằng chứng và cải tiến. Tất cả slide failure tiếp theo sẽ map về bốn nhóm này.`},
{sec:'CHƯƠNG III · WHY HARNESS?',title:"Don't start from components. Start from failure modes.",key:'Failure quan sát được → capability còn thiếu → quyết định thiết kế Harness.',body:`<div style="display:grid;grid-template-columns:1.25fr .75fr;gap:48px;height:100%"><table class="table"><thead><tr><th>Agent Failure</th><th>Harness Capability</th></tr></thead><tbody><tr><td>Thiếu hoặc sai context</td><td>KNOW</td></tr><tr><td>Biết nhưng không thực thi được</td><td>DO</td></tr><tr><td>Tool có quá nhiều quyền</td><td>CONTROL</td></tr><tr><td>Mất state giữa các bước</td><td>KNOW / LEARN</td></tr><tr><td>Agent tự báo DONE</td><td>LEARN</td></tr><tr><td>Loop sai kéo dài</td><td>CONTROL</td></tr><tr><td>Không trace được</td><td>LEARN</td></tr><tr><td>Đúng kỹ thuật, sai policy</td><td>CONTROL</td></tr></tbody></table><div class="down"><div class="node soft">AGENT FAILURE</div><div class="arrow">↓</div><div class="node">MISSING CAPABILITY</div><div class="arrow">↓</div><div class="node core">HARNESS DESIGN</div></div></div>`,notes:`Đây là cách tránh platform theater. Không bắt đầu bằng “chúng ta cần vector DB, MCP gateway hay agent framework”. Bắt đầu bằng failure có blast radius và tần suất cụ thể. Sau đó thiết kế capability tối thiểu để chặn, phát hiện hoặc phục hồi failure đó.`},
{sec:'CHƯƠNG III · FAILURE #1',title:'Good Model × Wrong Context = Wrong Action',key:'Context Engineering — Kỹ thuật ngữ cảnh — cung cấp đúng thông tin tại đúng thời điểm.',body:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:52px;height:100%"><div class="stack"><div class="bar">Task / Goal</div><div class="bar">Enterprise Architecture</div><div class="bar">Business Rules</div><div class="bar">Relevant Code</div><div class="bar">Current Runtime State</div><div class="bar">Historical Decisions</div></div><div class="down"><div class="node soft" style="width:380px">SELECT + COMPRESS<br><span class="tiny">Right context at the right time</span></div><div class="arrow">↓</div><div class="node core" style="width:330px">MODEL</div><div class="arrow">↓</div><div class="node" style="width:380px">CONTEXT-AWARE ACTION</div></div></div>`,notes:`Context không phải nhồi toàn bộ wiki vào cửa sổ model. Context engineering là chọn, cấu trúc, nén và cập nhật thông tin phù hợp với bước hiện tại. Một model mạnh với rule cũ hoặc trạng thái runtime sai vẫn tạo hành động sai. KNOW là capability động, không phải kho tài liệu tĩnh.`},
{sec:'CHƯƠNG III · FAILURE #2',title:'KNOW HOW ≠ CAN EXECUTE',key:'Biết phải query database không có nghĩa Model có thể query database.',body:`<div class="arch"><div class="down"><div class="node core">MODEL</div><div class="tiny">intent</div></div><div class="harness"><div class="label">TOOL CONTRACT</div><div class="stack"><div class="bar">Schema / Validation</div><div class="bar">MCP / API / CLI</div><div class="bar">Error normalization</div><div class="bar">Result → Observation</div></div></div><div class="stack"><div class="bar">Database</div><div class="bar">Browser</div><div class="bar">Git / Test runner</div><div class="bar">Enterprise services</div></div></div>`,notes:`DO biến intent thành capability. Tool contract cần mô tả đầu vào, đầu ra, lỗi và side effect; chỉ nối API chưa đủ. Google nêu kết nối models với tools và MCP như capability quan trọng. Cần tránh cấp một shell toàn quyền khi task chỉ cần một thao tác hẹp.`,src:[1]},
{sec:'CHƯƠNG III · FAILURE #3',title:'Action creates Authority',key:'Khi Agent có tool, Agent trở thành System Actor — Chủ thể hành động trong hệ thống.',body:`<div class="down" style="height:100%;justify-content:center"><div class="flow"><div class="node core">AGENT</div><div class="arrow">→</div><div class="node">IDENTITY</div><div class="arrow">→</div><div class="node">POLICY</div><div class="arrow">→</div><div class="node">PERMISSION</div><div class="arrow">→</div><div class="node">SANDBOX</div><div class="arrow">→</div><div class="node soft">TOOL</div></div><div class="bigquote" style="font-size:38px;text-align:center;margin-top:72px">WHO can do WHAT on WHICH resource under WHICH condition?</div><div class="grid g4" style="width:100%;margin-top:45px"><div class="card"><h3>Identity</h3><p>Định danh</p></div><div class="card"><h3>Permission</h3><p>Phân quyền</p></div><div class="card"><h3>Isolation</h3><p>Cô lập</p></div><div class="card"><h3>Policy</h3><p>Chính sách</p></div></div></div>`,notes:`Action luôn kéo theo authority. Identity của agent có thể là service account, delegated identity của user hoặc identity tạm thời theo task. Permission cần least privilege và có thể phụ thuộc điều kiện. Sandbox hạn chế blast radius; policy quyết định hành vi được phép. Prompt “hãy cẩn thận” không thay thế enforcement.`},
{sec:'CHƯƠNG III · FAILURE #4',title:'Context ≠ State ≠ Memory',key:'Ba khái niệm cùng liên quan “thông tin”, nhưng có vòng đời và trách nhiệm khác nhau.',body:`<div class="grid g3" style="height:100%"><div class="card" style="border-top:7px solid #3b82f6"><div class="label">CONTEXT</div><h3>Agent cần biết gì ngay bây giờ?</h3><p>Thông tin được đưa vào bước reasoning hiện tại.</p><p class="tiny">Ephemeral · Selected · Bounded</p></div><div class="card" style="border-top:7px solid #8b5cf6"><div class="label">STATE</div><h3>Công việc hiện đang ở đâu?</h3><p>Task step, artifact, retry, checkpoint và transition.</p><p class="tiny">Operational · Mutable · Recoverable</p></div><div class="card" style="border-top:7px solid #14b8a6"><div class="label">MEMORY</div><h3>Hệ thống cần nhớ điều gì từ trước?</h3><p>Sự kiện hoặc tri thức bền vững dùng lại sau phiên.</p><p class="tiny">Persistent · Curated · Governed</p></div></div>`,notes:`Google gộp state và memory management như capability Harness, nhưng khi thiết kế nên tách semantic. Context là view ở thời điểm inference. State là vị trí trong workflow và phục hồi. Memory là retention có chủ đích qua phiên. Nếu trộn lẫn, agent có thể dùng dữ liệu cũ như state hiện hành hoặc lưu thông tin nhạy cảm quá lâu.`,src:[1]},
{sec:'CHƯƠNG III · FAILURE #5',title:'DONE ≠ Evidence',key:'Self-report ≠ Verification. “Task completed” chỉ là một claim cần kiểm chứng.',body:`<div style="display:grid;grid-template-columns:.75fr 1.25fr;gap:70px;height:100%;align-items:center"><div class="card" style="border-left:8px solid var(--red)"><div class="label">AGENT SELF-REPORT</div><div class="bigquote" style="font-size:48px">“Task completed.”</div><ul><li>Test có chạy?</li><li>Requirement đủ?</li><li>Security đã check?</li><li>Artifact đúng logic?</li></ul></div><div class="flow"><div class="down"><div class="node core">ARTIFACT</div><div class="arrow">↓</div><div class="node">EVIDENCE</div><div class="arrow">↓</div><div class="node">EVALUATOR / TEST</div><div class="arrow">↓</div><div class="flow"><div class="node" style="border-color:var(--green)">PASS → DONE</div><div class="node" style="border-color:var(--red)">FAIL → CONTINUE</div></div></div></div></div>`,notes:`Verification có thể là unit test, policy validator, simulation, browser check, human approval hoặc independent evaluator. Quan trọng là evidence phải đến từ hệ thống có khả năng kiểm tra outcome, không chỉ từ cùng model tự đánh giá. Với task không thể tự động hóa hoàn toàn, Harness cần yêu cầu artifact và checkpoint cho human review.`},
{sec:'CHƯƠNG III · FAILURE #6',title:'Autonomy amplifies failure',key:'Một LLM có thể sai một câu; một autonomous Agent có thể thực hiện 100 hành động sai liên tiếp.',cls:'dark',body:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:70px;height:100%"><div class="down"><div class="node soft">Wrong assumption</div><div class="arrow">↓</div><div class="node soft">Wrong action</div><div class="arrow">↓</div><div class="node soft">Wrong observation</div><div class="arrow">↓</div><div class="node soft">Wrong re-plan</div><div class="arrow">↓</div><div class="node core">MORE WRONG ACTIONS ↺</div></div><div class="grid g2"><div class="card"><h3>Retry</h3><p>Có phân loại lỗi</p></div><div class="card"><h3>Stop condition</h3><p>Không lặp vô hạn</p></div><div class="card"><h3>Timeout / Budget</h3><p>Giới hạn tài nguyên</p></div><div class="card"><h3>Checkpoint</h3><p>Khôi phục có điểm neo</p></div><div class="card"><h3>Escalation</h3><p>Chuyển cho người</p></div><div class="card"><h3>Recovery</h3><p>Hoàn tác / tiếp tục</p></div></div></div>`,notes:`Loop control không chỉ là max iterations. Retry cần phân biệt transient error với semantic failure; checkpoint cần lưu artifact và state đủ để phục hồi; budget có thể gồm thời gian, token, cost và số side effects. Khi confidence thấp hoặc blast radius cao, escalation phải là một đường đi hợp lệ chứ không phải thất bại.`},
{sec:'CHƯƠNG III · FAILURE #7',title:'Traditional observability is not enough',key:'Agent cần quan sát toàn bộ Trajectory — Quỹ đạo hành động — không chỉ request/response.',body:`<div class="compare"><div class="side"><div class="label">APPLICATION TRACE</div><div class="down" style="margin-top:40px"><div class="node">Request</div><div class="arrow">↓</div><div class="node">Service</div><div class="arrow">↓</div><div class="node">Database</div><div class="arrow">↓</div><div class="node">Response</div></div></div><div class="vs">→</div><div class="side"><div class="label">AGENT TRAJECTORY</div><div class="flow" style="height:500px;flex-wrap:wrap;align-content:center"><div class="node">Goal</div><div class="arrow">→</div><div class="node">Model Call</div><div class="arrow">→</div><div class="node">Tool A</div><div class="node">Observation</div><div class="arrow">→</div><div class="node">Re-plan</div><div class="arrow">→</div><div class="node">Retry</div><div class="node">Tool B</div><div class="arrow">→</div><div class="node core">Outcome</div></div><p class="tiny">Model · Tool · State transition · Retry · Latency · Token · Cost · Outcome</p></div></div>`,notes:`Google nêu visibility như lợi ích của Harness. Agent observability cần nối decision, tool call, result, state transition và outcome trong cùng trajectory. Log riêng lẻ không giải thích vì sao agent chọn action. Cũng phải quản trị dữ liệu trace vì prompt và tool results có thể chứa thông tin nhạy cảm.`,src:[1]},
{sec:'CHƯƠNG III · FAILURE #8',title:'Technically correct ≠ Organizationally acceptable',key:'Correctness kỹ thuật không tự động đáp ứng security, architecture, data policy hay approval.',body:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:60px;height:100%"><div><table class="table"><thead><tr><th>Technical checks</th><th>Status</th></tr></thead><tbody><tr><td>Compile</td><td style="color:var(--green)">PASS</td></tr><tr><td>Unit Test</td><td style="color:var(--green)">PASS</td></tr><tr><td>Integration Test</td><td style="color:var(--green)">PASS</td></tr></tbody></table><table class="table" style="margin-top:28px"><thead><tr><th>Organization controls</th><th>Status</th></tr></thead><tbody><tr><td>Architecture Policy</td><td style="color:var(--red)">FAIL</td></tr><tr><td>Security / Data Access</td><td style="color:var(--red)">FAIL</td></tr><tr><td>Approval Required</td><td style="color:var(--red)">FAIL</td></tr></tbody></table></div><div class="compare" style="grid-template-columns:1fr 60px 1fr"><div class="side"><div class="label">SOFT CONTROL</div><div class="bigquote" style="font-size:34px">Prompt:<br>“Please don't…”</div></div><div class="vs">VS</div><div class="side"><div class="label">HARD CONTROL</div><div class="down"><div class="node">Policy</div><div class="arrow">↓</div><div class="node">Validator</div><div class="arrow">↓</div><div class="node">Permission</div><div class="arrow">↓</div><div class="node core">Action</div></div></div></div></div>`,notes:`Prompt là soft control: hữu ích để định hướng nhưng không có tính cưỡng chế. Hard control nằm ngoài model path và có thể từ chối action. Cần chọn mức kiểm soát theo hậu quả. Không phải mọi rule đều cần hard gate; nếu gate quá dày, latency và friction có thể làm hệ thống không dùng được.`},
{sec:'CHƯƠNG IV · INDUSTRY EVIDENCE',title:'Harness đang trở thành một industry concept',key:'Một pattern đang xuất hiện đồng thời ở kiến trúc, engineering practice, delivery và tổ chức.',body:`<div class="timeline" style="height:500px"><div class="t"><div class="dot"></div><strong>OPENAI</strong><p>Harness Engineering</p></div><div class="t"><div class="dot"></div><strong>ANTHROPIC</strong><p>Harness Design</p></div><div class="t"><div class="dot"></div><strong>DEEPSEEK</strong><p>Model + Harness</p></div><div class="t"><div class="dot"></div><strong>GOOGLE</strong><p>Agent Harness Runtime</p></div><div class="t"><div class="dot"></div><strong>TALKDESK</strong><p>Harness Delivery</p></div><div class="t"><div class="dot"></div><strong>TIMEE</strong><p>Harness Group</p></div></div><div class="flow" style="height:150px"><div class="node soft">Architecture</div><div class="arrow">→</div><div class="node soft">Practice</div><div class="arrow">→</div><div class="node soft">Platform</div><div class="arrow">→</div><div class="node soft">Delivery</div><div class="arrow">→</div><div class="node core">Organization</div></div>`,notes:`Không trình bày như sáu logo độc lập. Điểm chung là sự dịch chuyển từ model-centric sang environment-centric. Tuy nhiên, thuật ngữ và boundary chưa thống nhất. Đây là industry progression được tổng hợp từ các nguồn, không phải một roadmap chuẩn mà mọi tổ chức phải theo.`,src:[1,2,3,4,5,6]},
{sec:'CHƯƠNG IV · OPENAI',title:'Humans steer. Agents execute.',key:'Engineering chuyển từ trực tiếp viết code sang thiết kế environment, intent và feedback loops.',body:`<div class="metricrow"><div class="metric"><b>~1M</b><span>dòng code sau 5 tháng</span></div><div class="metric"><b>~1.500</b><span>pull requests mở và merge</span></div><div class="metric"><b>3</b><span>kỹ sư ban đầu driving Codex</span></div><div class="metric"><b>3,5</b><span>PR / kỹ sư / ngày</span></div></div><div class="compare" style="height:330px;margin-top:38px"><div class="side"><div class="label">TRADITIONAL</div><div class="flow"><div class="node">Engineer</div><div class="arrow">→</div><div class="node core">Write Code</div></div></div><div class="vs">→</div><div class="side"><div class="label">AGENT-FIRST</div><div class="flow"><div class="node">Specify intent</div><div class="arrow">→</div><div class="node">Design environment</div><div class="arrow">→</div><div class="node core">Agents execute</div></div></div></div><p class="tiny">OpenAI ước tính ~1/10 thời gian so với viết tay. Đây là case study tổng thể, không phải causal benchmark riêng của Harness.</p>`,notes:`Nêu caveat ngay khi trình bày số liệu: đây là báo cáo thực địa của OpenAI về một cách làm agent-first, không phải thử nghiệm kiểm soát độc lập. Không được nói “Harness tạo 10× productivity”. Kết quả đến từ model, team, constraint zero manually-written code, tooling, repository structure, feedback và operating model kết hợp.`,src:[2]},
{sec:'CHƯƠNG IV · ANTHROPIC',title:'Same Model ≠ Same Outcome',key:'Harness có thể tăng đáng kể chất lượng — nhưng đổi lại bằng cost, latency và orchestration complexity.',body:`<div style="display:grid;grid-template-columns:1fr .8fr;gap:60px;height:100%"><div><table class="table"><thead><tr><th></th><th>Solo Agent</th><th>Full Harness</th></tr></thead><tbody><tr><td>Runtime</td><td>20 phút</td><td>6 giờ</td></tr><tr><td>Cost</td><td>~$9</td><td>~$200</td></tr><tr><td>Architecture</td><td>Single agent</td><td>Planner → Generator → Evaluator</td></tr><tr><td>Observed quality</td><td>UI có vẻ đúng nhưng workflow lỗi</td><td>Ứng dụng đầy đủ và usable hơn</td></tr></tbody></table><p class="tiny" style="margin-top:20px">Case study dùng Claude Opus 4.5; full harness đắt hơn 20× trong thử nghiệm được mô tả.</p></div><div class="down"><div class="node">PLANNER</div><div class="arrow">↓</div><div class="node core">GENERATOR</div><div class="arrow">↓</div><div class="node">EVALUATOR</div><div class="arrow">↓ feedback ↺</div></div></div>`,notes:`Anthropic cho thấy harness design ảnh hưởng outcome ngay cả với cùng model. Solo run trông ban đầu phù hợp nhưng khi click-through xuất hiện vấn đề; full harness có planner, generator và evaluator, chạy lâu hơn đáng kể. Caveat quan trọng: chất lượng cao hơn không miễn phí; minimum harness phải phù hợp required reliability.`,src:[3]},
{sec:'CHƯƠNG IV · GOOGLE ENTERPRISE',title:'DevOps Incident Agent: từ cảnh báo đến điều tra có kiểm soát',key:'Harness kết hợp operational context, tools, IAM và evidence trong restricted guardrails.',body:`<div class="arch"><div class="down"><div class="node" style="border-color:var(--red)">INCIDENT</div><div class="arrow">↓</div><div class="node core">AGENT</div></div><div class="harness"><div class="label">HARNESS</div><div class="stack"><div class="bar"><b>KNOW</b> · Incident context / State</div><div class="bar"><b>DO</b> · Logging / Monitoring</div><div class="bar"><b>CONTROL</b> · IAM / Guardrails</div><div class="bar"><b>LEARN</b> · Trace / Evidence</div></div></div><div class="stack"><div class="bar">Cloud Logging</div><div class="bar">Cloud Monitoring</div><div class="bar">Traces</div><div class="bar">Operational Tools</div></div></div>`,notes:`Google mô tả operational DevOps và incident diagnostics như một use case: triage error spikes, phân tích log traces và đề xuất remediation trong restricted operational guardrails. Slide map use case vào framework của seminar; cần nói rõ mapping KNOW/DO/CONTROL/LEARN là diễn giải của chúng ta, không phải taxonomy Google.`,src:[1]},
{sec:'CHƯƠNG IV · GOOGLE ENTERPRISE',title:'One use case, four Harness properties',key:'Không Harness: AI có thể gợi ý. Có Harness: AI có thể điều tra và hành động trong boundary.',body:`<table class="table" style="font-size:25px"><thead><tr><th>Harness property</th><th>DevOps Incident Agent</th><th>Failure được xử lý</th></tr></thead><tbody><tr><td><b>KNOW</b></td><td>Incident context, logs, metrics, traces</td><td>Reasoning trên dữ liệu thiếu hoặc cũ</td></tr><tr><td><b>DO</b></td><td>Logging API, Monitoring API, operational tools</td><td>Biết cách nhưng không điều tra được</td></tr><tr><td><b>CONTROL</b></td><td>IAM, allowed actions, restricted guardrails</td><td>Authority vượt blast radius</td></tr><tr><td><b>LEARN</b></td><td>Trajectory, evidence, outcome</td><td>Không biết vì sao Agent kết luận</td></tr></tbody></table><div class="flow" style="height:175px;margin-top:36px"><div class="node soft">AI SUGGESTS</div><div class="arrow">+</div><div class="node">HARNESS</div><div class="arrow">→</div><div class="node core">AI INVESTIGATES<br>& ACTS</div></div>`,notes:`Slide này nối case study trở lại framework trung tâm để không biến chương industry thành tập hợp logo. Cùng một hệ thống có thể bắt đầu read-only: agent điều tra và đề xuất. Khi control/evidence trưởng thành, có thể cho phép remediation hẹp. Autonomy nên mở rộng theo evidence, không theo kỳ vọng.` ,src:[1]},
{sec:'CHƯƠNG IV · TALKDESK',title:'Agent Harness Delivery: delivery model quanh Agent',key:'Conventions + skills/tools + guardrails + orchestration + human review gates.',body:`<div style="display:grid;grid-template-columns:.8fr 1.2fr;gap:60px;height:100%"><div class="ladder"><div class="step">Waterfall</div><div class="step">Agile</div><div class="step">DevOps</div><div class="step" style="background:var(--blue);color:#fff">Agent Harness<br>Delivery</div></div><div class="stack" style="justify-content:center"><div class="bar">Conventions · Codebase organization</div><div class="bar">Skills & Tools · Reusable capabilities</div><div class="bar">Guardrails · Rigid boundaries</div><div class="bar">Workflow orchestration · Explicit steps</div><div class="bar">Human review gates · Mandatory checkpoints</div></div></div>`,notes:`Talkdesk mô tả Agent Harness Delivery như discipline xây và vận hành harness để human specify intent và agent thực thi. Đây là case study doanh nghiệp tự báo cáo, không phải benchmark độc lập. Nếu trình bày productivity nội bộ, phải gắn nhãn internal data; deck này không dùng thêm số liệu chưa cần thiết.`,src:[5]},
{sec:'CHƯƠNG IV · TIMEE',title:'From individual setup to Agent Harness Group',key:'Harness có thể tiến hóa thành Organizational Capability — nhưng không bắt buộc thành một team riêng.',body:`<div style="display:grid;grid-template-columns:1.1fr .9fr;gap:65px;height:100%;align-items:center"><div class="flow" style="flex-wrap:wrap"><div class="node soft">Individual developer</div><div class="arrow">→</div><div class="node soft">Local Agent setup</div><div class="arrow">→</div><div class="node">Common patterns</div><div class="arrow">→</div><div class="node">Shared Harness</div><div class="arrow">→</div><div class="node">Platform Capability</div><div class="arrow">→</div><div class="node core">Agent Harness Group</div></div><div class="card" style="padding:42px"><span class="tag fact">Fact · Timee [6]</span><h3 style="font-size:38px;margin-top:26px">Mission</h3><p>Build AI workflows centered on Coding Agents.</p><p>Promote <b>Safe Autonomous Operation</b> — Vận hành tự chủ an toàn.</p></div></div>`,notes:`Timee thông báo Agent Harness Group với mission xây AI workflows quanh Coding Agents và thúc đẩy safe autonomous operation. Đây là bằng chứng cho một organizational pattern, không phải lý do để mọi công ty lập “Harness Team”. Capability có thể nằm trong AI Platform, Developer Platform, SRE/Security hoặc mô hình federated.`,src:[6]},
{sec:'CHƯƠNG V · HARNESS AT SCALE',title:'Harness vs Orchestration',key:'Workflow mô tả flow. Harness tạo execution environment để Agent chạy flow an toàn và đáng tin cậy.',body:`<div class="compare"><div class="side"><div class="label">ORCHESTRATION FRAMEWORK</div><div class="down" style="margin-top:68px"><div class="node">Step A</div><div class="arrow">↓</div><div class="node">Step B</div><div class="arrow">↓</div><div class="node">Step C</div></div><p class="tiny" style="text-align:center;margin-top:45px">Who runs next? What sequence?</p></div><div class="vs">OVERLAP</div><div class="side"><div class="label">HARNESS</div><div class="grid g2" style="margin-top:25px"><div class="card"><h3>Runtime</h3><p>Chạy ở đâu?</p></div><div class="card"><h3>State</h3><p>Lưu ở đâu?</p></div><div class="card"><h3>Tools</h3><p>Dùng gì?</p></div><div class="card"><h3>Permission</h3><p>Quyền nào?</p></div><div class="card"><h3>Observe</h3><p>Trace ra sao?</p></div><div class="card"><h3>Recover</h3><p>Phục hồi thế nào?</p></div></div></div></div>`,notes:`Không nói workflow luôn là subset tuyệt đối của Harness. Trong nhiều sản phẩm, orchestration framework cũng quản lý state, tool và retry; boundary overlap. Distinction hữu ích nằm ở câu hỏi: orchestration tập trung vào flow; harness tập trung vào môi trường và điều kiện thực thi.`},
{sec:'CHƯƠNG V · HARNESS AT SCALE',title:'Harness Strength ∝ Autonomy × Consequence',key:'Không phải mọi Agent đều cần Full Harness; cường độ Harness tăng theo quyền tự chủ và hậu quả.',body:`<div class="scatter"><div class="dotp" style="left:8%;bottom:10%"><span>Chatbot</span></div><div class="dotp" style="left:26%;bottom:24%"><span>Research Agent</span></div><div class="dotp" style="left:45%;bottom:42%"><span>Coding Agent</span></div><div class="dotp" style="left:65%;bottom:62%"><span>DevOps Agent</span></div><div class="dotp" style="left:83%;bottom:84%;background:var(--red)"><span>Production Agent</span></div></div><span class="tag proposed" style="position:absolute;right:90px;top:220px">Mental model · Không phải công thức định lượng</span>`,notes:`Google lưu ý basic chatbot có thể không cần full agent harness. Khi agent truy cập live database, web, multi-step workflow hoặc external actions, Harness quan trọng hơn. Trục autonomy và consequence giúp phân biệt một agent read-only với agent có thể thay đổi production. Dấu tỷ lệ là mental model, không phải công thức đo lường.` ,src:[1]},
{sec:'CHƯƠNG V · HARNESS AT SCALE',title:'Minimum Harness for Required Reliability',key:'Mục tiêu không phải “càng nhiều Harness càng tốt” — mà là capability tối thiểu để đạt reliability cần thiết.',body:`<div style="display:grid;grid-template-columns:.8fr 1.2fr;gap:65px;height:100%;align-items:center"><div class="equation">MINIMUM<br><span class="accent">HARNESS</span><br><span style="font-size:34px">FOR</span><br>REQUIRED<br>RELIABILITY</div><table class="table"><thead><tr><th>Gain</th><th>Cost</th></tr></thead><tbody><tr><td>Reliability</td><td>Latency</td></tr><tr><td>Safety</td><td>Token / Model cost</td></tr><tr><td>Visibility</td><td>Infrastructure</td></tr><tr><td>Autonomy</td><td>Complexity</td></tr><tr><td>Governance</td><td>Engineering overhead</td></tr></tbody></table></div>`,notes:`Anthropic là bằng chứng trực quan: full harness chạy 6 giờ và ~$200 so với 20 phút và ~$9. Nếu task chỉ cần draft low-risk, full evaluator loop có thể lãng phí. Nếu task sửa production, minimum harness có thể rất mạnh. Reliability target phải được xác định trước khi chọn architecture.`,src:[3]},
{sec:'CHƯƠNG V · LEARNING SYSTEM',title:'Harness as a Learning System',key:'CAPTURE → LEARN → GOVERN biến failure lặp lại thành capability bền vững.',body:`<div class="cycle" style="height:500px"><div class="c">CAPTURE<br><span class="tiny">Trace · Failure · Human intervention</span></div><div class="arrow">→</div><div class="c">LEARN<br><span class="tiny">Root cause · Pattern</span></div><div class="arrow">→</div><div class="c">GOVERN<br><span class="tiny">Context · Tool · Policy · Eval</span></div><div class="arrow">↺</div></div><div class="card" style="margin-top:18px;padding:24px 34px"><div class="label">EXAMPLE</div><p style="font-size:25px">Agent liên tục quên integration test → không chỉ sửa prompt → thêm test command + verification gate + required evidence + CI enforcement.</p></div>`,notes:`Harness engineering trưởng thành khi mỗi failure tạo ra thay đổi hệ thống có thể tái sử dụng. Capture phải đủ chi tiết để phân biệt model error, context error, tool error, policy error và evaluator gap. Govern không nhất thiết luôn là hard gate; có thể là context tốt hơn, tool contract hẹp hơn hoặc feedback rõ hơn.`},
{sec:'CHƯƠNG V · SHARED CAPABILITY',title:'From Local Harness to Shared Harness',key:'Shared Harness xuất hiện do repeated problems — không vì cần thêm một platform theo phong trào.',body:`<div class="compare"><div class="side"><div class="label">LOCAL · DUPLICATED</div><div class="grid g3" style="margin-top:30px"><div class="card"><h3>Team A</h3><p>Tools<br>Rules<br>Context</p></div><div class="card"><h3>Team B</h3><p>Tools<br>Rules<br>Context</p></div><div class="card"><h3>Team C</h3><p>Tools<br>Rules<br>Context</p></div></div><ul style="font-size:21px;line-height:1.5"><li>Inconsistent permission & evaluation</li><li>Fragmented observability</li><li>Duplicated sandbox / integration</li></ul></div><div class="vs">→</div><div class="side"><div class="label">SHARED HARNESS</div><div class="node core" style="width:100%;margin:35px 0">Context · Tools · Runtime · Policy · Eval · Trace</div><div class="flow" style="height:240px"><div class="node">Agent A</div><div class="node">Agent B</div><div class="node">Agent C</div></div><p class="tiny" style="text-align:center;margin-top:18px">Common controls · Domain-specific behavior</p></div></div>`,notes:`Shared capability có giá trị khi các team đang giải cùng vấn đề integration, identity, sandbox, eval và audit. Nếu maturity thấp hoặc use cases rất khác, platform hóa sớm có thể tạo bottleneck. Nên trích xuất golden path từ patterns đã chứng minh, không áp đặt abstraction trước khi có demand.`},
{sec:'CHƯƠNG V · OPERATING MODEL',title:'What does a Harness Team own?',key:'Harness Team sở hữu HOW Agents Work; Domain Team sở hữu WHAT Agents Do.',body:`<div style="display:grid;grid-template-columns:1.15fr .85fr;gap:60px;height:100%"><div class="stack"><div class="bar">Context Infrastructure</div><div class="bar">Tool / MCP Ecosystem</div><div class="bar">Agent Runtime / Sandbox</div><div class="bar">Identity / Policy</div><div class="bar">Evaluation Platform</div><div class="bar">Agent Observability</div><div class="bar">Standards / Golden Paths</div></div><div class="compare" style="grid-template-columns:1fr 32px 1fr"><div class="side"><div class="label">HARNESS / AI PLATFORM</div><h3 style="font-size:38px">HOW</h3><p>Agents làm việc như thế nào?</p></div><div class="vs">×</div><div class="side"><div class="label">DOMAIN / PRODUCT</div><h3 style="font-size:38px">WHAT</h3><p>Agents làm nghiệp vụ gì?</p></div></div></div>`,notes:`Harness Team không nên build mọi Agent. Platform team cung cấp paved road, runtime, policy, eval và trace; domain team chịu trách nhiệm goal, business semantics và outcome. Ownership có thể phân tán: security sở hữu policy, platform sở hữu runtime, domain sở hữu evaluator. “Team” ở đây là operating model, không nhất thiết org chart riêng.`},
{sec:'CHƯƠNG V · OPERATING MODEL',title:'Harness Engineering overlaps Platform Engineering',key:'Platform Engineering tạo môi trường để software chạy tốt; Harness Engineering tạo môi trường để Agent làm việc tốt.',body:`<table class="table" style="font-size:23px"><thead><tr><th>Platform Engineering</th><th>Harness Engineering</th></tr></thead><tbody><tr><td>Developer</td><td>Agent</td></tr><tr><td>Developer Portal</td><td>Agent Interface / Context</td></tr><tr><td>Golden Path</td><td>Agent Workflow</td></tr><tr><td>API / SDK</td><td>Tool / MCP</td></tr><tr><td>Runtime</td><td>Sandbox / Agent Runtime</td></tr><tr><td>CI/CD</td><td>Verification / Gate</td></tr><tr><td>Observability</td><td>Agent Trajectory</td></tr><tr><td>IAM</td><td>Agent Permission</td></tr></tbody></table><p class="key" style="text-align:center;margin-top:30px">Capability có overlap lớn — không nhất thiết tạo thêm organizational silo.</p>`,notes:`Đây là analogy, không phải mapping 1:1. Developer và agent có nhu cầu khác: agent cần context machine-readable, deterministic feedback và fine-grained tool contracts. Tuy nhiên, tổ chức đã có platform engineering mạnh có thể mở rộng capability hiện hữu thay vì dựng stack mới hoàn toàn.`},
{sec:'CHƯƠNG VI · KẾT LUẬN',title:'Final Mental Model',key:'Agent là hệ thống hành động trong Environment; Harness biến reasoning thành outcome có thể vận hành và quản trị.',body:`<div class="arch"><div class="down"><div class="node">GOAL</div><div class="arrow">↓</div><div class="node core">MODEL<br><span style="font-size:17px">Reasoning</span></div></div><div class="harness"><div class="label">HARNESS</div><div class="stack"><div class="bar"><b>KNOW</b> · Context</div><div class="bar"><b>DO</b> · Tools</div><div class="bar"><b>CONTROL</b> · Policy</div><div class="bar"><b>LEARN</b> · Feedback</div></div></div><div class="down"><div class="node">ENVIRONMENT</div><div class="arrow">↓</div><div class="node core">OUTCOME</div></div></div>`,notes:`Quay lại bốn câu hỏi: Agent biết gì, làm được gì, được phép làm gì và làm sao biết nó đã làm đúng. Nếu chỉ nhớ một diagram, hãy nhớ Model nằm trong hệ thống chứ không phải toàn bộ hệ thống. Harness là logical environment nối Model với Environment và Outcome.`},
{sec:'CHƯƠNG VI · KẾT LUẬN',title:'Industry Progression',key:'Chưa có organizational standard thống nhất — nhưng pattern environment-centric đang hình thành ở nhiều tầng.',body:`<div class="ladder" style="height:535px"><div class="step">MODEL</div><div class="step">AGENT</div><div class="step">HARNESS</div><div class="step">HARNESS<br>ENGINEERING</div><div class="step">SHARED AGENT<br>PLATFORM</div><div class="step" style="background:var(--blue);color:#fff">ORGANIZATIONAL<br>CAPABILITY</div></div><div class="flow" style="height:120px;margin-top:20px"><div class="tag">OpenAI · Engineering</div><div class="tag">Anthropic · Design</div><div class="tag">DeepSeek · Architecture</div><div class="tag">Google · Runtime</div><div class="tag">Talkdesk · Delivery</div><div class="tag">Timee · Group</div></div>`,notes:`Không nên hiểu progression như maturity model bắt buộc. Một startup có thể chỉ cần local harness tốt; doanh nghiệp lớn có thể cần shared identity, sandbox, audit và eval. Bằng chứng ngành cho thấy cùng một concern xuất hiện ở nhiều tầng — từ implementation tới operating model.`,src:[1,2,3,4,5,6]},
{sec:'CHƯƠNG VI · CLOSING',title:'When AI starts acting, we must manage execution.',key:'Harness is the environment that makes Agent execution possible, reliable and governable.',cls:'dark',body:`<div style="display:grid;grid-template-columns:1.25fr .75fr;gap:75px;height:100%;align-items:center"><div><div class="bigquote">When AI only answers, we manage <span class="accent">OUTPUT</span>.</div><div class="bigquote" style="margin-top:34px">When AI starts acting, we must manage <span class="accent">EXECUTION</span>.</div><p class="key" style="margin-top:45px">Khi AI chỉ trả lời, chúng ta quản lý đầu ra. Khi AI bắt đầu hành động, chúng ta phải quản lý việc thực thi.</p></div><div class="down"><div class="node soft">ANSWER</div><div class="arrow">↓</div><div class="node soft">ACTION</div><div class="arrow">↓</div><div class="node soft">AUTONOMY</div><div class="arrow">↓</div><div class="node core">HARNESS</div><div class="arrow">↓</div><div class="node soft">TRUST</div></div></div>`,notes:`Kết thúc bằng luận điểm trung tâm: Model tạo Intelligence; Harness biến Intelligence thành Execution. Trust không đến từ lời hứa của model mà từ context đúng, capability có kiểm soát, evidence và feedback. Mời người nghe dùng bốn câu hỏi KNOW / DO / CONTROL / LEARN để đánh giá agent hiện có trong tổ chức.`},
{sec:'APPENDIX · Q&A',title:'Eight questions to pressure-test a Harness',key:'Dùng các câu hỏi này để làm rõ boundary, quality và operating model.',cls:'ice',body:`<div class="grid g2" style="height:100%"><div class="card"><h3>01 · Tool Calling SDK có đủ?</h3><p>Capability tối thiểu nào làm nó trở thành environment?</p></div><div class="card"><h3>02 · Boundary ở đâu?</h3><p>Agent Framework · Harness · Runtime · Platform</p></div><div class="card"><h3>03 · Model mạnh hơn thay đổi gì?</h3><p>Capability nào mất đi — capability nào quan trọng hơn?</p></div><div class="card"><h3>04 · Đo Harness Quality thế nào?</h3><p>Tách khỏi Model Quality bằng eval matrix nào?</p></div><div class="card"><h3>05 · Khi nào nên dùng Shared Platform?</h3><p>Repeated problem hay abstraction quá sớm?</p></div><div class="card"><h3>06 · Autonomy tăng, control nào tăng?</h3><p>Identity · Permission · Evidence · Recovery</p></div><div class="card"><h3>07 · Harness Team khác Platform Team?</h3><p>Tránh silo mới bằng ownership nào?</p></div><div class="card"><h3>08 · Minimum Harness là gì?</h3><p>Reliability target và consequence quyết định ra sao?</p></div></div>`,notes:`Đây là appendix để mở thảo luận. Không cố đưa ra câu trả lời tuyệt đối vì boundary phụ thuộc implementation và risk profile. Có thể chọn 2–3 câu phù hợp đối tượng: kỹ thuật tập trung boundary/runtime; lãnh đạo tập trung shared platform, quality và operating model.`}
];
const deck=document.getElementById('deck');
function sourceHTML(ids=[]){return ids.map(id=>`<a href="${sources[id][1]}" target="_blank" rel="noreferrer">[${id}] ${sources[id][0].split(' — ')[0]}</a>`).join('')}
slides.forEach((s,i)=>{const el=document.createElement('section');el.className=`slide ${s.cls||''}`;el.dataset.title=s.title;el.innerHTML=`<p class="chapter editable">${s.sec}</p><h2 class="headline editable">${s.title}</h2><p class="key editable">${s.key}</p><div class="canvas editable">${s.body}</div><aside class="source-links">${(s.src||[]).join(',')}</aside><footer class="footer"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${s.sec}</span><span class="src">${sourceHTML(s.src)}</span></footer>`;[...el.querySelectorAll('.editable')].forEach((node,j)=>{node.dataset.storeKey=`hslide-v2-edit-${i}-${j}`;const saved=localStorage.getItem(node.dataset.storeKey);if(saved!==null)node.innerHTML=saved});deck.appendChild(el)});
const els=[...document.querySelectorAll('.slide')];let index=Math.max(0,Math.min(els.length-1,Number(localStorage.getItem('hslide-v2-index')||0)));let edit=false;
function scale(){const vv=window.visualViewport;const w=vv?.width||innerWidth,h=vv?.height||innerHeight;const s=Math.min(w/1920,h/1080);deck.style.transform=`translate(-50%,-50%) scale(${s})`}
function render(){els.forEach((e,i)=>e.classList.toggle('active',i===index));document.getElementById('counter').textContent=`${index+1} / ${els.length}`;document.getElementById('progress').style.width=`${((index+1)/els.length)*100}%`;document.getElementById('notesText').innerHTML=slides[index].notes;localStorage.setItem('hslide-v2-index',index)}
function go(n){index=Math.max(0,Math.min(els.length-1,n));render()}
function isTyping(){const a=document.activeElement;return a&&(a.matches('input,textarea')||a.isContentEditable)}
document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>go(index+1);document.getElementById('notesBtn').onclick=()=>document.getElementById('notesPanel').classList.toggle('open');document.getElementById('editBtn').onclick=()=>{edit=!edit;document.body.classList.toggle('edit-on',edit);document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit)};
addEventListener('keydown',e=>{if(isTyping())return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}if(e.key==='Home')go(0);if(e.key==='End')go(els.length-1);if(e.key.toLowerCase()==='n')document.getElementById('notesPanel').classList.toggle('open');if(e.key.toLowerCase()==='e')document.getElementById('editBtn').click()});
document.addEventListener('input',e=>{if(edit&&e.target.classList.contains('editable')&&e.target.dataset.storeKey)localStorage.setItem(e.target.dataset.storeKey,e.target.innerHTML)});
addEventListener('resize',scale);window.visualViewport?.addEventListener('resize',scale);scale();render();
</script>
</body>
</html>
